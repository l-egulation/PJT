<h1>1·2챕터 정비소 · 채택 디자인</h1><p>실제 Unity 캡처 위 HTML 조립 시안입니다. Unity 상호작용·씬·저장·포탈 기능은 미적용입니다.</p>
<div><button id="s1">1스테이지</button><button id="s2">2스테이지</button><button id="size">정수 확대 2×</button><button id="compare">원본 캡처만 보기</button></div>
<div><button id="intro">첫 방문 재생</button><button id="next-line">글자 완성 / 다음</button><button id="skip-intro">연출 건너뛰기</button></div><p id="dialogue-status">Space·F·Enter · 글자 완성 / 다음 대사</p>
<div><label><input id="idle" type="checkbox" checked>NPC 대기</label><button id="pause">연출 정지</button><label><input id="light" type="checkbox" checked>불빛</label><label><input id="swing" type="checkbox" checked>간판</label></div>
<div><label><input data-layer="backdrop" type="checkbox" checked>뒤 구조물</label><label><input data-layer="npc" type="checkbox" checked>NPC</label><label><input data-layer="desk" type="checkbox" checked>작업대</label></div>
<p id="status">이미지를 준비하고 있습니다.</p><div class="frame" id="frame"><canvas width="960" height="540"></canvas></div><p id="source"></p>
<p><a id="png" href="stage2-actual-composite.png">정적 조립 PNG</a> · <a id="raw" href="references/stage2-actual.png">실제 캡처 원본</a></p>
<p>NPC·뒤 구조물·책상·전등·간판은 runtime의 독립 PNG입니다. 2상인 기존 색상과 완벽주의 작업실, 어두운 석재·넓은 벽감을 채택했습니다. 대기 모션은 발 아래20행을 고정한 절차적 호흡이며 손그림 프레임 애니메이션이 아닙니다.</p>
