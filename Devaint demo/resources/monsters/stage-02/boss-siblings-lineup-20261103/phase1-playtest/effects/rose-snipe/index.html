<!doctype html><html lang="ko"><meta charset="utf-8"><title>Rose 저격 · 조준과 명중</title><style>body{margin:20px;background:#18232d;color:#e8e7ed;font:16px system-ui}main{max-width:1000px;margin:auto}h1{font-size:24px}p{color:#c0cfda;line-height:1.6}button,a{display:inline-block;padding:10px;margin:4px;color:#ead6e4;background:#33404f;border:1px solid #74879b}canvas{display:block;max-width:100%;image-rendering:pixelated;margin:12px 0}</style><main><h1>Rose 저격 · 조준 → 고정 → 팡!</h1><p>몸통을 1초 추적 → 위치 고정 0.3초 → 고정 지점에 즉시 명중.<br>네모 박스 대신 분홍빛 조준 고리가 모입니다. 고정 뒤 플레이어가 이동해도 조준점은 남습니다.</p><button id="reset">전체 재생</button><button id="track">추적 보기</button><button id="lock">고정 보기</button><button id="hit">명중 보기</button><a href="../../">1페이즈 조작 테스트</a><p id="status"></p><canvas id="map" width="960" height="540"></canvas><p>4배 확대</p><canvas id="zoom" width="480" height="360"></canvas><p>디자인 및 합성 미리보기 · Unity 적용 전. 실제 피해는 기존 단발 20 유지.</p></main><script type="module">
import {drawSnipeAim,drawSnipeImpact} from './snipe.mjs?v=2';
import {platforms} from '../../rules.mjs';
const load=p=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=p});
const [bg,terrain,source]=await Promise.all(['../../../map-preview/assets/D.png','../../../map-preview/assets/terrain-preview.png','../../../map-preview/assets/approved-player.png'].map(load));
const tmp=document.createElement('canvas');tmp.width=source.width;tmp.height=source.height;const tc=tmp.getContext('2d');tc.drawImage(source,0,0);const a=tc.getImageData(0,0,tmp.width,tmp.height).data;let l=tmp.width,r=0,top=tmp.height,b=0;for(let y=0;y<tmp.height;y++)for(let x=0;x<tmp.width;x++)if(a[(y*tmp.width+x)*4+3]>24){l=Math.min(l,x);r=Math.max(r,x);top=Math.min(top,y);b=Math.max(b,y)}
const actor=document.createElement('canvas');actor.width=r-l+1;actor.height=b-top+1;actor.getContext('2d').drawImage(source,l,top,actor.width,actor.height,0,0,actor.width,actor.height);
const c=document.querySelector('#map').getContext('2d'),z=document.querySelector('#zoom').getContext('2d');let time=0,last=performance.now(),running=true;
const freeze=t=>{time=t;running=false};document.querySelector('#track').onclick=()=>freeze(.7);document.querySelector('#lock').onclick=()=>freeze(1.16);document.querySelector('#hit').onclick=()=>freeze(1.36);document.querySelector('#reset').onclick=()=>{time=0;last=performance.now();running=true};
const px=t=>460+Math.sin(t*2.3)*14+(t>1?(t-1)*45:0);
function scene(ctx,t){ctx.imageSmoothingEnabled=false;ctx.drawImage(bg,0,0);for(const p of platforms)ctx.drawImage(terrain,128,192,96,16,p.x,p.y,p.w,16);ctx.drawImage(actor,Math.round(px(t)-33),222,66,64);const x=t<1?px(t):px(1),y=259;if(t<1.3)drawSnipeAim(ctx,x,y,t<1?t:(t-1)/.3,t>=1);else drawSnipeImpact(ctx,x,y,t-1.3);}
function frame(now){if(running)time+=Math.max(0,Math.min(.2,(now-last)/1000));last=now;const t=time%2.5;scene(c,t);z.save();z.scale(4,4);z.translate(-420,-210);scene(z,t);z.restore();document.querySelector('#status').textContent=(t<1?'조준 추적':t<1.3?'위치 고정 · 0.3초':t<1.46?'짧고 날카로운 명중 섬광':'종료')+' · '+t.toFixed(2)+'초';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
