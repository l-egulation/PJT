apiVersion: v1
kind: Namespace
metadata:
  name: hanjjak
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: hanjjak
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: hanjjak
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "pods/log", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: hanjjak
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: hanjjak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: application-config
  namespace: hanjjak
data:
  POSTGRES_DB: hanjjak
  POSTGRES_USER: hanjjak
  PUBLIC_ORIGIN: https://game.example.com
  OFFLINE_REWARD_TEST_ALL_ACCOUNTS: "true"
  OFFLINE_REWARD_TEST_REWARD_MULTIPLIER: "0.5"
  OFFLINE_REWARD_TEST_GRACE_PERIOD_SECONDS: "0"
  OFFLINE_REWARD_TEST_BUCKET_SECONDS: "60"
  OFFLINE_REWARD_TEST_ACCRUAL_CAP_SECONDS: "28800"
  BASIC_AUTH_ENABLED: "false"
  BASIC_AUTH_USERNAME: hanjjak
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: hanjjak
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: hanjjak
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17.11-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: application-config
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/hanjjak-secrets/db-password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: db-password
              mountPath: /var/run/hanjjak-secrets
              readOnly: true
      volumes:
        - name: db-password
          secret:
            secretName: db-password
            items:
              - key: password
                path: db-password
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: game-api
  namespace: hanjjak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: game-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-api
  namespace: hanjjak
spec:
  replicas: 0
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: game-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: game-api
          image: docker.io/hanjjak/game-api:bootstrap
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: application-config
            - secretRef:
                name: application-secrets
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/$(POSTGRES_DB)
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: POSTGRES_USER
            - name: DB_PASSWORD_FILE
              value: /var/run/hanjjak-secrets/db-password
            - name: BATTLE_COMPATIBILITY_API_ENABLED
              value: "false"
            - name: AUTH_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: PUBLIC_ORIGIN
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: SERVER_SERVLET_SESSION_COOKIE_SECURE
              value: "true"
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: ADMIN_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: PUBLIC_ORIGIN
            - name: ADMIN_GITLAB_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: PUBLIC_ORIGIN
            - name: ADMIN_GITLAB_SUCCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: PUBLIC_ORIGIN
            - name: ADMIN_GITLAB_FAILURE_URL
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: PUBLIC_ORIGIN
            - name: ADMIN_SESSION_COOKIE_SECURE
              value: "true"
            - name: DEPLOY_COMMIT_SHA
              value: k3s-migration-9c74938
            - name: SOCIAL_LOGIN_PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: PUBLIC_ORIGIN
            - name: SOCIAL_LOGIN_SUCCESS_URL
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: PUBLIC_ORIGIN
            - name: SOCIAL_LOGIN_FAILURE_URL
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: PUBLIC_ORIGIN
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: db-password
              mountPath: /var/run/hanjjak-secrets
              readOnly: true
      volumes:
        - name: db-password
          secret:
            secretName: db-password
            items:
              - key: password
                path: db-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-assets
  namespace: hanjjak
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
