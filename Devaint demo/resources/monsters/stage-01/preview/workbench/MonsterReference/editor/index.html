<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공통 픽셀 편집기</title><link rel="stylesheet" href="editor.css"></head><body><header><h1>공통 픽셀 편집기</h1><p>같은 편집기에서 작업 데이터만 바꿉니다. 배경·확대·격자 설정은 작업을 전환해도 유지됩니다.</p></header><main><section class="toolbar" aria-label="프로젝트"><label>작업 <select id="project"></select></label><button id="loadButton">수정 JSON 불러오기</button><input id="loadFile" type="file" accept=".json,application/json" hidden><button id="save">전체 수정 JSON 저장 · Ctrl+S</button><span id="projectInfo"></span></section><section class="toolbar" aria-label="재생"><button id="prev">◀ 이전</button><select id="frame" aria-label="프레임"></select><button id="next">다음 ▶</button><button id="play">재생</button><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1">1배</option><option value="1.5">1.5배</option></select></label><label><input id="loop" type="checkbox" checked>반복</label><span id="frameInfo"></span></section><section class="toolbar" aria-label="화면"><label>배경 <select id="background"><option value="dark">진회색</option><option value="gray">회색</option><option value="white">흰색</option><option value="checker">체크무늬</option></select></label><label>확대 <select id="zoom"><option value="4">4배</option><option value="6">6배</option><option value="8">8배</option><option value="10">10배</option><option value="12">12배</option></select></label><label><input id="grid" type="checkbox">격자</label><label><input id="onion" type="checkbox">이전 프레임 겹치기</label><label>보기 <select id="view"><option value="composite">몸체+무기</option><option value="body">몸체만</option><option value="weapon">무기만</option></select></label></section><section class="toolbar" aria-label="픽셀 편집"><label>수정 대상 <select id="target"><option value="body">몸체</option><option value="weapon">공통 무기</option></select></label><button data-tool="pen">펜</button><button data-tool="erase">지우개</button><button data-tool="fill">영역 채우기</button><button data-tool="pick">스포이드</button><button data-tool="move">무기 이동</button><label>붓 <select id="brush"><option>1</option><option>2</option><option>3</option><option>5</option></select>px</label><span id="palette"></span><span id="colorValue"></span><button id="undo">취소 · Ctrl+Z</button><button id="redo">다시 · Ctrl+Shift+Z</button></section><section class="toolbar" aria-label="무기 배치"><label><input id="weaponVisible" type="checkbox">현재 프레임 무기 표시</label><label>X <input id="weaponX" type="number" step="1"></label><label>Y <input id="weaponY" type="number" step="1"></label><label>각도 <input id="weaponAngle" type="number" step="5"></label><button id="resetPlacement">현재 무기 배치 복원</button></section><div id="status" role="status">편집 데이터를 불러오는 중…</div><div id="thumbnails" class="thumbnails"></div><section class="workspace"><div class="viewport"><canvas id="stage" tabindex="0" aria-label="픽셀 편집 화면"></canvas></div><aside><h2>현재 합성 미리보기</h2><canvas id="preview"></canvas><p id="editingInfo"></p><p>드래그: 칠하기 / 무기 이동<br>우클릭: 현재 대상 색 추출<br>← →: 프레임 이동<br>배경색은 편집 화면에만 적용됩니다.</p></aside></section><section class="toolbar" aria-label="내보내기"><button id="exportComposite">현재 합성 PNG</button><button id="exportBody">현재 몸체 PNG</button><button id="exportWeapon">현재 무기 레이어 PNG</button><button id="exportWeaponSource">공통 무기 원본 PNG</button><button id="export8">에테르용 8배 PNG · 흰 배경</button></section><p class="footer">브라우저 임시 저장과 별도로 수정 JSON을 저장해 주세요. 새 수정본도 위의 JSON 불러오기로 이어서 작업할 수 있습니다.</p></main><script src="project-data.js"></script><script src="editor-core.js"></script><script src="editor.js"></script></body></html>
