<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>몬스터 공격 FX · 잉크 잠행 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#222623;color:#e8e7df;font:15px system-ui,sans-serif}header,main{max-width:1400px;margin:auto;padding:26px}header{padding-bottom:8px}h1{font-size:27px;margin:0 0 10px}h2{font-size:20px;margin:0}p{color:#bfc8be;line-height:1.65;margin:10px 0}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:18px 0}button,select,a.download{background:#424b40;color:#f0eee3;border:1px solid #687260;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}a{color:#d4c89e}.controls label{display:flex;align-items:center;gap:6px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding-top:10px}.card{border:1px solid #515a4e;border-radius:12px;padding:18px;background:#2a302a;min-width:0}.card.large{grid-column:1/-1}.screen{margin-top:16px;overflow:auto;background:#eeeae2}canvas{display:block;margin:auto;image-rendering:pixelated;max-width:none}.meta{font-size:14px;color:#e4d1a2;min-height:22px;margin-top:12px}.pill{font-size:12px;border:1px solid #737c64;border-radius:20px;padding:3px 9px;margin-left:8px;color:#d5d9c8}.timeline{width:100%;accent-color:#c2b38a}.steps{display:flex;gap:8px;flex-wrap:wrap}.steps span{padding:8px 12px;background:#3a4236;border-radius:6px;font-size:13px}.steps .on{background:#b5a77f;color:#20251e}.palette{display:inline-flex;gap:5px;margin-left:12px}.palette i{width:17px;height:17px;display:block;border-radius:3px;border:1px solid #6a6d60}.links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}.notice{font-size:13px;color:#aeb9aa}@media(max-width:1000px){main{grid-template-columns:1fr}.card.large{grid-column:auto}}
</style>
<header><h1>몬스터 공격 이펙트 <span class="pill">네이티브 픽셀 시안</span></h1>
<p>외곽선 없이 이펙트당 최대 3색. 기존 공격 자세와 타격 시점에 맞춰 재생합니다.</p>
<div class="controls"><button id="play">일시정지</button><button id="restart">처음부터</button><select id="speed" aria-label="재생 속도"><option value="1">1배속</option><option value=".5">0.5배속</option><option value=".25">0.25배속</option></select><select id="background" aria-label="배경"><option value="#eeeae2">밝은 배경</option><option value="#454b42">어두운 배경</option><option value="#ffffff">흰 배경</option></select><label><input type="checkbox" id="fx" checked>이펙트</label><label><input type="checkbox" id="boxes">판정 영역</label><label><input type="checkbox" id="dodge" checked>새 패턴 회피 예시</label></div>
<p class="notice">기존 공격 판정은 현재 마을의 시험 수치를 사용합니다. 잉크 잠행 패턴은 신규 시안이며 Unity에는 아직 적용하지 않았습니다.</p>
<div class="links"><a target="_blank" href="all-attack-fx-preview.gif">몹별 이펙트 모아보기 GIF</a><a download href="native-frames.zip">프레임 PNG·시트·타이밍 ZIP</a><a target="_blank" href="contact-sheet.png">주요 장면 모아보기</a></div></header>
<main id="cards"></main>
<script>
let data,playing=true,speed=1,background='#eeeae2',fxOn=true,boxes=false,dodge=true,last=performance.now();const cards=[],cache=new Map;
function load(src){if(!cache.has(src))cache.set(src,new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>resolve(im);im.onerror=()=>reject(Error('이미지 로드 실패: '+src));im.src=src}));return cache.get(src)}
function index(ms,t){for(let i=0;i<ms.length;i++){if(t<ms[i])return i;t-=ms[i]}return ms.length-1}
function sum(ms){return ms.reduce((a,b)=>a+b,0)}
const clamp=(x)=>Math.max(0,Math.min(1,x));
function paint(c,im,x,gy,pivot){c.drawImage(im,Math.round(x-pivot[0]),Math.round(gy-pivot[1]))}
function ground(c,w,h){c.imageSmoothingEnabled=false;c.fillStyle=background;c.fillRect(0,0,w,h);c.fillStyle=background==='#454b42'?'#717a68':'#bcb8ae';c.fillRect(0,h-22,w,1);c.fillStyle=background==='#454b42'?'#3b4138':'#dfdbd2';c.fillRect(0,h-21,w,21)}
function hitbox(c,x,y,w,h,active){c.fillStyle=active?'#db69562a':'#61898016';c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));c.strokeStyle=active?'#c14f3c':'#6d9389';c.lineWidth=1;c.strokeRect(Math.round(x)+.5,Math.round(y)+.5,Math.round(w),Math.round(h))}
function setupCard(title,desc,large=false){let el=document.createElement('section');el.className='card'+(large?' large':'');el.innerHTML='<h2>'+title+'</h2><p>'+desc+'</p><div class="screen"><canvas></canvas></div><input class="timeline" type="range" min="0" step="10" value="0" aria-label="'+title+' 시간"><div class="meta"></div><div class="links"></div>';document.querySelector('#cards').append(el);let canvas=el.querySelector('canvas');canvas.width=large?480:320;canvas.height=large?210:190;canvas.style.width=canvas.width*2+'px';canvas.style.height=canvas.height*2+'px';let c={el,canvas,ctx:canvas.getContext('2d'),t:0};el.querySelector('input').oninput=e=>{playing=false;document.querySelector('#play').textContent='재생';c.t=+e.target.value;render(c)};cards.push(c);return c}
async function init(){data=await(await fetch('review.json')).json();for(const clip of Object.values(data.clips))clip.images=await Promise.all(clip.frames.map(load));
for(const m of data.monsters){const desc={thorn:'앞으로 베며 돌진 · 판정 58×48px',broom:'공격 범위를 채운 먼지가 앞으로 퍼지며 옅어짐 · 83×38px',elite:'갈고리 회수 뒤, 반대 손 할퀴기에 맞춘 먼지 · 80×77px'}[m.key];const c=setupCard(m.name,desc);c.type='attack';c.mon=m;c.images=await Promise.all(m.attack.frames.map(load));c.fx=data.clips[m.key];c.duration=sum(m.attack.ms)+850;c.el.querySelector('input').max=c.duration;c.el.querySelector('.links').innerHTML='<a download href="'+m.key+'-attack-preview.gif">합성 GIF</a><a href="'+c.fx.name+'/sheet.png" target="_blank">FX 시트</a>';}
const c=setupCard('엘리트 추가 패턴 · 잉크 잠행 → 분출','녹아 사라진 뒤 1초 잠행. 발밑에서 0.55초간 부글거린 뒤 솟구치며 한 번 타격합니다.',true);c.type='burrow';c.duration=3900;c.el.querySelector('input').max=c.duration;c.base=await load(data.monsters[2].base);c.player=data.player?await load(data.player):null;c.el.querySelector('.links').innerHTML='<a download href="elite-burrow-preview.gif">새 패턴 GIF</a><a href="elite-burrow-body/sheet.png" target="_blank">녹아내림 시트</a><a href="elite-emerge-body/sheet.png" target="_blank">재형성 시트</a>';const steps=document.createElement('div');steps.className='steps';steps.innerHTML=['녹아내림','잠행 1초','발밑 예고','분출·타격','회복'].map(s=>'<span>'+s+'</span>').join('');c.el.insertBefore(steps,c.el.querySelector('.screen'));requestAnimationFrame(tick)}
function render(c){const ctx=c.ctx,w=c.canvas.width,h=c.canvas.height,gy=h-22,t=c.t;ground(ctx,w,h);
if(c.type==='attack'){let x=216;const a=c.mon.attack,f=c.fx,active=t>=f.damageWindowMs[0]&&t<f.damageWindowMs[1];if(c.mon.key==='thorn')x-=Math.round(48*clamp((t-650)/200));const i=index(a.ms,Math.min(t,sum(a.ms)-1));paint(ctx,c.images[i],x,gy,a.pivot);const ft=t-f.activeAtMs;if(fxOn&&ft>=0&&ft<sum(f.ms))paint(ctx,f.images[index(f.ms,ft)],x,gy,f.pivot);if(boxes){const [bw,bh]=f.attackSizePx,[ox,oy]=f.attackOffsetPx;hitbox(ctx,x+ox-bw/2,gy+oy-bh/2,bw,bh,active)}c.el.querySelector('.meta').textContent=(active?'타격 판정 ON':'')+' · '+(t/1000).toFixed(2)+'초 · 자세 '+(i+1)+'/'+a.ms.length+' · FX '+(ft>=0&&ft<sum(f.ms)?(index(f.ms,ft)+1)+'/'+f.ms.length:'—');}
else{let phase=t<550?0:t<1550?1:t<2100?2:t<2280?3:4;const target=165,origin=366;let px=target;if(dodge&&t>1770)px-=Math.round(92*clamp((t-1770)/250));if(c.player){const im=c.player;paint(ctx,im,px,gy,data.playerPivot||[64,121])}else{ctx.fillStyle='#e3d9bb';ctx.fillRect(px-7,gy-31,14,31)}
if(t<550){const f=data.clips.melt;paint(ctx,f.images[index(f.ms,t)],origin,gy,f.pivot)}else if(t<1550){/* hidden */}else if(t<2100){const f=data.clips.bubbles;if(fxOn)paint(ctx,f.images[index(f.ms,t-1550)],target,gy,f.pivot)}else{const f=data.clips.emerge;paint(ctx,f.images[index(f.ms,t-2100)],target,gy,f.pivot);const burst=data.clips.burst;if(fxOn&&t-2100<sum(burst.ms))paint(ctx,burst.images[index(burst.ms,t-2100)],target,gy,burst.pivot)}
if(boxes&&t>=1550&&t<2700)hitbox(ctx,target-45,gy-96,90,96,t>=2100&&t<2280);c.el.querySelectorAll('.steps span').forEach((e,i)=>e.classList.toggle('on',phase===i));c.el.querySelector('.meta').textContent=(t/1000).toFixed(2)+'초 · '+['녹아내림 · 피해 없음','잠행 중 · 피해 없음','공격 위치 고정 · 회피 가능','분출 · 1회 타격','회복 · 피해 없음'][phase];}
c.el.querySelector('.timeline').value=Math.round(t)}
function tick(now){let dt=Math.min(80,now-last);last=now;for(const c of cards){if(playing)c.t=(c.t+dt*speed)%c.duration;render(c)}requestAnimationFrame(tick)}
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생'};document.querySelector('#restart').onclick=()=>cards.forEach(c=>c.t=0);document.querySelector('#speed').onchange=e=>speed=+e.target.value;document.querySelector('#background').onchange=e=>{background=e.target.value;document.querySelectorAll('.screen').forEach(s=>s.style.background=background)};document.querySelector('#fx').onchange=e=>fxOn=e.target.checked;document.querySelector('#boxes').onchange=e=>boxes=e.target.checked;document.querySelector('#dodge').onchange=e=>dodge=e.target.checked;
init().catch(e=>{let p=document.createElement('p');p.textContent=e.message;document.querySelector('header').append(p);console.error(e)});
</script></html>
