<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>벽타기 직접 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a22;color:#e9f0ed;font:15px system-ui,sans-serif}header{padding:18px 26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}button,select{font:inherit;background:#253a46;border:1px solid #52717b;border-radius:8px;padding:9px 14px;color:inherit;cursor:pointer}button.active{background:#e8bd5c;color:#17232b;border-color:#e8bd5c}.controls{margin-left:auto;display:flex;gap:9px}main{padding:0 22px 18px}canvas{display:block;width:100%;height:min(72vh,780px);background:#52656d;border:1px solid #354d59;border-radius:12px;outline:none;touch-action:none}aside{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-top:12px;color:#c7d8da;line-height:1.9}kbd{background:#273b46;border:1px solid #526a76;border-radius:4px;padding:2px 6px}.note{color:#8fa6ae;font-size:12px}.touch{display:flex;gap:8px;margin-top:10px}.touch button{touch-action:none;user-select:none;min-width:55px}#status{color:#f4cf79}#error{color:#ff9c86}
</style>
<header><h1>벽타기 직접 테스트</h1><span id="status">이미지 불러오는 중…</span><div class="controls"><button id="ink" class="active">잉크</button><button id="human">인간</button><button id="reset">처음으로 · R</button></div></header>
<main><canvas id="game" tabindex="0" aria-label="벽타기 테스트. 방향키 이동, 위 방향키 오르기, 스페이스 점프"></canvas><aside><div><kbd>← →</kbd> 또는 <kbd>A D</kbd> 이동 · 벽 근처에서 ↑를 누르면 오르기<br><kbd>↑ W</kbd> 오르기 · ↑를 놓으면 벽에서 떨어짐 · <kbd>Space</kbd> 점프 / 2단 점프 · ↑ + Space 벽차기</div><div><label><input type="checkbox" id="stamina" checked> 게임 기준 벽 체력 1초</label><br><label><input type="checkbox" id="boxes"> 접촉 판정 표시</label> · <kbd>1</kbd> 잉크 <kbd>2</kbd> 인간</div></aside><div class="touch"><button data-key="ArrowLeft">←</button><button data-key="ArrowRight">→</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="Space">점프</button></div><p class="note">채택한 벽타기 그림을 직접 조작하는 미리보기입니다. 이동·점프 수치는 현재 데이터에서 가져오며, 벽타기 그림은 8% 확대 비교 중이며, 벽 끝은 손 높이에서 끌어올리기로 전환합니다. 충돌·벽 끝 보조 이동은 HTML용 간이 구현입니다. Unity 실행 결과와는 차이가 있습니다.</p><div id="error"></div></main>
<script src="wall-test-data.js"></script>
<script>+"use strict";
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),keys=new Set(),cfg=WALL_TEST_DATA;
const walls=[{x:6,w:2,h:6},{x:12,w:2,h:9},{x:18,w:3,h:4}],half=.34,height=1.8;
let kind='ink',hero,now=0,camera={x:0,y:3},loaded=false,jumpQueued=false,last=0,acc=0,images={ink:[],human:[]},poseImages={};
function reset(){hero={x:4.3,y:0,vx:0,vy:0,facing:1,ground:true,jumps:0,wall:0,gripAt:0,spent:0,spentWall:null,lock:0,ledgeAt:-99,airAt:-99,kickAt:-99,jumpAt:-99,poseAt:0,poseName:"idle",hopUntil:0,ledge:null};camera={x:0,y:3};keys.clear();jumpQueued=false;canvas.focus()}
function body(k){kind=k;document.querySelector('#ink').classList.toggle('active',k==='ink');document.querySelector('#human').classList.toggle('active',k==='human');canvas.focus()}
document.querySelector('#ink').onclick=()=>body('ink');document.querySelector('#human').onclick=()=>body('human');document.querySelector('#reset').onclick=reset;
function key(code,down){if(down){if(code==='Space'&&!keys.has(code))jumpQueued=true;keys.add(code)}else keys.delete(code)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS','KeyR','Digit1','Digit2'].includes(e.code)){if(/INPUT|SELECT/.test(e.target.tagName))return;e.preventDefault();if(e.code==='KeyR')reset();else if(e.code==='Digit1')body('ink');else if(e.code==='Digit2')body('human');else key(e.code,true)}});
window.addEventListener('keyup',e=>key(e.code,false));window.addEventListener('blur',()=>{keys.clear();jumpQueued=false});
for(const b of document.querySelectorAll('[data-key]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key(b.dataset.key,true)};b.onpointerup=b.onpointercancel=()=>key(b.dataset.key,false)}
const pressed=(a,b)=>keys.has(a)||keys.has(b);
function step(dt){now+=dt;let h=hero;
if(h.ledge){let l=h.ledge,t=Math.min(1,(now-h.ledgeAt)/.48),ease=t*t*(3-2*t);h.x=l.x+(l.endX-l.x)*ease;h.y=l.y+(l.top-l.y)*ease;h.vx=h.vy=0;h.wall=0;h.ground=false;jumpQueued=false;if(t>=1){h.y=l.top;h.ground=true;h.ledge=null;h.jumps=0;h.spent=0;h.lock=0}camera.x+=(h.x-camera.x)*Math.min(1,dt*5);camera.y+=(Math.max(3,h.y+2)-camera.y)*Math.min(1,dt*4);return}
let axis=+pressed('ArrowRight','KeyD')-+pressed('ArrowLeft','KeyA'),up=+pressed('ArrowUp','KeyW')-+pressed('ArrowDown','KeyS');let contact=walls.find(w=>h.y<w.h-.05&&h.y+height>0&&(Math.abs(h.x+half-w.x)<.07||Math.abs(h.x-half-w.x-w.w)<.07));let side=contact?(h.x<contact.x?1:-1):0;
if(h.ground){h.jumps=0;h.spent=0;h.spentWall=null}if(axis)h.facing=axis;
let grip=contact&&up>0&&now>h.lock&&(!h.ground||up>0)&&(h.spentWall!==contact||!document.querySelector('#stamina').checked||h.spent<cfg.movement.wallSlide.staminaDuration);
if(jumpQueued){jumpQueued=false;if((grip||h.wall)&&up>0){let s=side||h.wall;h.vx=-s*(axis===s?cfg.movement.wallJump.horizontalSpeed:cfg.movement.wallJump.awayHorizontalSpeed);h.kickAt=now;h.vy=cfg.movement.secondJumpVelocity;h.facing=-s;h.lock=now+(axis===s?cfg.movement.wallJump.carryDuration:cfg.movement.wallJump.releaseCarryDuration);h.ground=false;grip=false;h.wall=0;h.jumps=1}else if(h.jumps<2){h.vy=h.jumps?cfg.movement.secondJumpVelocity:cfg.movement.firstJumpVelocity;if(h.jumps)h.airAt=now;h.jumps++;h.jumpAt=now;h.ground=false}}
if(grip){if(!h.wall)h.gripAt=now;if(h.spentWall!==contact){h.spent=0;h.spentWall=contact}h.wall=side;h.spent+=dt;h.facing=side;h.vx=0;h.vy=up?up*cfg.movement.runSpeed:-(now-h.gripAt<cfg.movement.wallSlide.clingDuration?0:Math.min(cfg.movement.wallSlide.maxSpeed,cfg.movement.wallSlide.startSpeed+(now-h.gripAt)*cfg.movement.wallSlide.acceleration));h.ground=false;
if(up>0&&contact.h-h.y<=height*.95){h.ledge={x:h.x,y:h.y,top:contact.h,endX:side>0?contact.x+half+.12:contact.x+contact.w-half-.12};h.vx=h.vy=0;h.wall=0;h.ledgeAt=now;h.lock=now+.48;return}}
else{h.wall=0;if(now>=h.lock){let target=axis*cfg.movement.runSpeed,seconds=cfg.movement.horizontalControl[h.ground?(axis?"groundAccelerationSeconds":"groundDecelerationSeconds"):(axis?"airAccelerationSeconds":"airDecelerationSeconds")];h.vx+=Math.max(-cfg.movement.runSpeed/seconds*dt,Math.min(cfg.movement.runSpeed/seconds*dt,target-h.vx));}h.vy-=(h.vy>0?cfg.movement.riseGravity:cfg.movement.fallGravity)*dt}
let oldY=h.y;h.x+=h.vx*dt;h.x=Math.max(.4,Math.min(25,h.x));h.y+=h.vy*dt;h.ground=false;
for(const w of walls){if(h.x+half>w.x&&h.x-half<w.x+w.w){if(oldY>=w.h-.02&&h.y<=w.h&&h.vy<=0){h.y=w.h;h.vy=0;h.ground=true}else if(h.y<w.h-.01){if(h.x<w.x+w.w/2)h.x=w.x-half;else h.x=w.x+w.w+half;h.vx=0}}}
if(h.y<=0){h.y=0;h.vy=0;h.ground=true;h.wall=0}camera.x+=(h.x-camera.x)*Math.min(1,dt*5);camera.y+=(Math.max(3,h.y+2)-camera.y)*Math.min(1,dt*4);
}
function sprite(){let h=hero,idx=0;if(now-h.ledgeAt<.48)idx=29+Math.min(11,Math.floor((now-h.ledgeAt)/.04));else if(h.wall){let t=now-h.gripAt;let start=cfg.startSeconds.reduce((a,b)=>a+b,0);if(t<start){idx=Math.min(5,Math.floor(t/.025))}else{let phase=(t-start)%cfg.climbSeconds.reduce((a,b)=>a+b,0),n=0;while(n<cfg.climbSeconds.length-1&&phase>=cfg.climbSeconds[n])phase-=cfg.climbSeconds[n++];idx=6+n}}return idx}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let scale=Math.min(62,h/11),sx=x=>w*.46+(x-camera.x)*scale,sy=y=>h*.68-(y-camera.y)*scale;ctx.fillStyle='#263c46';ctx.fillRect(0,sy(0),w,h);ctx.strokeStyle='#6d858c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,sy(0));ctx.lineTo(w,sy(0));ctx.stroke();
for(const wall of walls){let x=sx(wall.x),y=sy(wall.h);ctx.fillStyle='#344b55';ctx.fillRect(x,y,wall.w*scale,wall.h*scale);ctx.strokeStyle='#8c9d98';ctx.strokeRect(x,y,wall.w*scale,wall.h*scale);ctx.fillStyle='#b5c5c2';ctx.fillRect(x,y,wall.w*scale,5);ctx.fillStyle='#e0e6de';ctx.font='13px system-ui';ctx.fillText(wall.h+'m',x+8,y-12)}
if(loaded){let wallArt=hero.wall||now-hero.ledgeAt<.48,i=sprite(),f=cfg.anchors[i],im=images[kind][i],flip=hero.facing;
if(!wallArt){let name=now-hero.kickAt<.22?'wall_kick':hero.ground?(Math.abs(hero.vx)>.2?'walk':'idle'):now-hero.jumpAt<.06?'jump_start':hero.vy>2?'jump_rise':hero.vy> -2?'jump_apex':'fall_loop';if(hero.poseName!==name){hero.poseName=name;hero.poseAt=now}let c=cfg.poses[kind][name]||cfg.poses[kind].idle;let t=now-hero.poseAt,total=c.seconds.reduce((a,b)=>a+b,0);t=['idle','walk'].includes(name)?t%total:Math.min(t,total-.00001);let n=0;while(n<c.seconds.length-1&&t>=c.seconds[n])t-=c.seconds[n++];let key=c.frames[n];f=cfg.media[key];im=poseImages[key];if(name==='wall_kick')flip=-hero.facing;}
let size=scale/f.ppu*(wallArt?1.08:1),iw=wallArt?460:f.w,ih=wallArt?520:f.h;ctx.save();ctx.translate(sx(hero.x)-(hero.wall?.4375*hero.facing*scale:0),sy(hero.y));ctx.scale(flip,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,-f.px*iw*size,-(1-f.py)*ih*size,iw*size,ih*size);ctx.restore()}
if(document.querySelector('#boxes').checked){ctx.strokeStyle='#e9bd64';ctx.strokeRect(sx(hero.x-half),sy(hero.y+height),half*2*scale,height*scale)}
let state=hero.ledge?'벽 끝 끌어올리기':hero.wall?(pressed('ArrowUp','KeyW')?'벽 오르기':pressed('ArrowDown','KeyS')?'내려가기':'벽 잡기'):now-hero.ledgeAt<.48?'벽 끝 올라서기':now-hero.kickAt<.22?'벽차기 · 기존 모션':hero.ground?'지상':'공중';document.querySelector('#status').textContent=(kind==='ink'?'잉크':'인간')+' · '+state;if(hero.wall&&document.querySelector('#stamina').checked){let x=sx(hero.x)-25,y=sy(hero.y+height)-18;ctx.fillStyle='#1a2930';ctx.fillRect(x,y,50,5);ctx.fillStyle='#e8bd5c';ctx.fillRect(x,y,50*Math.max(0,1-hero.spent/cfg.movement.wallSlide.staminaDuration),5)}
}
function tick(t){if(!last)last=t;acc+=Math.min(.1,(t-last)/1000);last=t;while(acc>=1/120){if(loaded)step(1/120);acc-=1/120}draw();requestAnimationFrame(tick)}
const posesReady=Promise.all(Object.entries(cfg.media).map(([key,f])=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{poseImages[key]=im;resolve()};im.onerror=reject;im.src=f.src})));
Promise.all(['ink','human'].flatMap(k=>Array.from({length:41},(_,i)=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>{images[k][i]=im;resolve()};im.onerror=()=>reject(new Error('프레임을 읽지 못했습니다: '+im.src));im.src='../runtime/'+k+'/F'+String(i+1).padStart(2,'0')+'.png'})))).then(()=>posesReady).then(()=>loaded=true).catch(e=>document.querySelector('#error').textContent=e.message);reset();requestAnimationFrame(tick);
</script></html>
