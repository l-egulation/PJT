<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일반 몬스터 · 외곽선 없는 전체 모션</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#242622;color:#eeeae1;font:16px system-ui,sans-serif}header,main{max-width:1800px;margin:auto;padding:24px}h1{font-size:27px}p{color:#c5c6ba;line-height:1.7}button,select{font:inherit;color:inherit;background:#42453e;border:1px solid #72776a;border-radius:7px;padding:9px;cursor:pointer}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding-top:0}article{min-width:0;background:#30342d;border:1px solid #626859;border-radius:12px;padding:16px}h2{font-size:20px;margin:0 0 14px}.stage{overflow:auto;background:#efeee8}canvas{display:block;image-rendering:pixelated;margin:auto}a{color:#ddc59e}input[type=range]{width:100%}.meta{font-size:14px;min-height:28px;margin:10px 0}.labels{display:flex;justify-content:space-around;margin:12px 0}.downloads{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.swatches{display:flex;gap:8px;margin:15px 0}.swatches i{width:26px;height:26px;border:1px solid #aaa}@media(max-width:1750px){main{grid-template-columns:1fr}article{max-width:760px;width:100%;margin:auto}}
</style>
<header><h1>일반 몬스터 · 외곽선 없는 전체 모션</h1><p>왼쪽은 이전 시안, 오른쪽은 이번 보정본. 같은 프레임과 박자로 비교합니다.<br>기존 6색 · 원래 크기·실루엣·타이밍 유지 · 주인공은 같은 픽셀 배율</p>
<div class="controls"><select id="motion" aria-label="모션"><option value="all">전체 순서 재생</option><option value="idle">대기</option><option value="walk">걷기</option><option value="attack">공격</option><option value="hit">피격</option><option value="death">죽음</option><option value="base">기본 자세</option></select><button id="play">일시정지</button><button id="reset">처음부터</button><select id="speed" aria-label="속도"><option value="1">1배속</option><option value="0.5">0.5배속</option></select><select id="bg" aria-label="배경"><option value="#efeee8">밝은 배경</option><option value="#ffffff">흰 배경</option><option value="#454b48">어두운 배경</option></select><select id="zoom" aria-label="확대"><option value="2">2배</option><option value="3">3배</option><option value="4">4배</option></select><a href="../../previews/approved/index.html">전체 확정 몬스터 / 편집</a></div><div class="swatches"></div><p id="status">프레임을 불러오는 중…</p></header><main></main>
<script>
const labels={base:'기본',idle:'대기',walk:'걷기',attack:'공격',hit:'피격',death:'죽음'},order=['idle','walk','attack','hit','death'];
const colors=['#171716','#41413D','#575451','#817D77','#9C968D','#D6D0C7'];document.querySelector('.swatches').innerHTML=colors.map(c=>`<i title="${c}" style="background:${c}"></i>`).join('');
const cards=[];let playing=true,speed=1,bg='#efeee8',zoom=2,last=performance.now(),player;
const load=src=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('이미지 로드 실패'));im.src=src});
function timeline(mon,key){let result=[];for(const k of key==='all'?order:[key]){const m=mon.motions[k];for(let r=0;r<((key==='all'&&['idle','walk'].includes(k))?2:1);r++)m.ms.forEach((ms,i)=>result.push({key:k,i,ms}));if(!m.loop)result.push({key:k,i:m.ms.length-1,ms:650})}return result}
function draw(c){let t=c.t,i=0;while(i<c.line.length-1&&t>=c.line[i].ms)t-=c.line[i++].ms;const f=c.line[i],m=c.mon.motions[f.key],ctx=c.ctx;ctx.imageSmoothingEnabled=false;ctx.fillStyle=bg;ctx.fillRect(0,0,256,144);ctx.fillStyle='#aeb0a4';ctx.fillRect(0,136,256,1);ctx.drawImage(m.before[f.i],0,16);ctx.drawImage(m.after[f.i],128,16);if(player){const b=c.playerBox;ctx.drawImage(player,b[0],b[1],b[2],b[3],4,136-b[3],b[2],b[3]);}c.meta.textContent=labels[f.key]+' · '+(f.i+1)+' / '+m.ms.length+'장 · '+(m.ms.reduce((a,b)=>a+b)/1000).toFixed(2)+'초';c.slider.value=i;c.canvas.style.width=256*zoom+'px';c.canvas.style.height=144*zoom+'px'}
function tick(now){const dt=Math.min(100,now-last);last=now;for(const c of cards){if(playing)c.t=(c.t+dt*speed)%c.total;draw(c)}requestAnimationFrame(tick)}
async function init(){const data=await fetch('data.json').then(r=>r.json());player=await load('../selected-large-review-v1/player.png');const pc=document.createElement('canvas');pc.width=player.width;pc.height=player.height;const px=pc.getContext('2d');px.drawImage(player,0,0);const p=px.getImageData(0,0,pc.width,pc.height).data;let l=pc.width,t=pc.height,r=0,b=0;for(let y=0;y<pc.height;y++)for(let x=0;x<pc.width;x++)if(p[(y*pc.width+x)*4+3]){l=Math.min(l,x);r=Math.max(r,x+1);t=Math.min(t,y);b=Math.max(b,y+1)}
for(const mon of data){for(const m of Object.values(mon.motions)){m.before=await Promise.all(m.before.map(load));m.after=await Promise.all(m.after.map(load));}const el=document.createElement('article');el.innerHTML=`<h2>${mon.name}</h2><div class="labels"><span>이전 시안 + 주인공</span><span>어두운 경계·빗자루 밝기 보정</span></div><div class="stage"><canvas width="256" height="144"></canvas></div><div class="meta"></div><input aria-label="프레임" type="range" min="0" value="0"><div class="downloads"><a download href="${mon.id}.gif">전체 모션 GIF</a><a href="../../approved/${mon.id}/idle/editor.json" download>대기 편집 JSON</a></div>`;document.querySelector('main').append(el);const canvas=el.querySelector('canvas'),c={mon,canvas,ctx:canvas.getContext('2d'),meta:el.querySelector('.meta'),slider:el.querySelector('input'),t:0,line:timeline(mon,'all'),playerBox:[l,t,r-l,b-t]};c.total=c.line.reduce((s,f)=>s+f.ms,0);c.slider.max=c.line.length-1;c.slider.oninput=()=>{playing=false;document.querySelector('#play').textContent='재생';c.t=c.line.slice(0,+c.slider.value).reduce((s,f)=>s+f.ms,0);draw(c)};cards.push(c)}document.querySelector('#status').textContent='3종 · 기본 포함 175프레임 · PNG / 편집 JSON / 시트 동기화 완료';requestAnimationFrame(tick)}
document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'일시정지':'재생'};document.querySelector('#reset').onclick=()=>cards.forEach(c=>c.t=0);document.querySelector('#speed').onchange=e=>speed=+e.target.value;document.querySelector('#bg').onchange=e=>{bg=e.target.value;document.querySelectorAll('.stage').forEach(s=>s.style.background=bg)};document.querySelector('#zoom').onchange=e=>zoom=+e.target.value;document.querySelector('#motion').onchange=e=>cards.forEach(c=>{c.line=timeline(c.mon,e.target.value);c.total=c.line.reduce((s,f)=>s+f.ms,0);c.t=0;c.slider.max=c.line.length-1});init().catch(e=>document.querySelector('#status').textContent=e.message);
</script></html>
