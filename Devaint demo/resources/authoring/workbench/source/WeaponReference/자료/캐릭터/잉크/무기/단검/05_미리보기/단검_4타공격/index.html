<!doctype html><html lang="ko"><meta charset="utf-8"><title>단검 4타 공격</title><style>body{background:#19232c;color:#eee;max-width:1152px;margin:24px auto;font:16px system-ui}button,select{padding:12px;background:#34485c;color:white;border:1px solid #8495a6;margin:4px;border-radius:5px;cursor:pointer}canvas,img{image-rendering:pixelated;max-width:100%}canvas{background:#465161;width:100%}p{color:#becbd6}#frames button{padding:8px}</style><h2>단검 · 4타 공격</h2><p>1타 가로 → 2타 올려베기 → 3타 내려베기 → 4타 역수 마무리<br>화면 클릭 / Space: 한 타씩 공격. 공격 중 다음 입력 1회 예약, 종료 후 300ms 안에 클릭하면 다음 타.<br>기존 베기 자세를 재조합한 첫 시안 · 짧은 손잡이 · 흰색·회색 픽셀 잔상 + 손끝 파편</p><button id="attack">공격</button><button id="auto">4타 연속 보기</button><button id="reset">대기</button><select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option><option value="0.25">0.25배</option></select><label><input id="effects" type="checkbox" checked> 이펙트</label><span id="status"></span><canvas id="view" width="768" height="640" tabindex="0"></canvas><h3>타별 재생</h3><nav id="hits"></nav><h3>프레임 하나씩 보기</h3><nav id="frames"></nav><img src="이펙트_공격합성.png"><img src="프레임비교.png"><script>const data=[{"name": "1타 · 짧은 가로베기", "frames": ["../../03_작업중/단검_4타공격/1타/01.png", "../../03_작업중/단검_4타공격/1타/02.png", "../../03_작업중/단검_4타공격/1타/03.png"], "ms": [45, 75, 45], "poses": ["H1", "H2", "H3"], "reverse": false}, {"name": "2타 · 되받아 올려베기", "frames": ["../../03_작업중/단검_4타공격/2타/01.png", "../../03_작업중/단검_4타공격/2타/02.png", "../../03_작업중/단검_4타공격/2타/03.png"], "ms": [45, 75, 45], "poses": ["D3", "H2", "D1"], "reverse": false}, {"name": "3타 · 내려베기", "frames": ["../../03_작업중/단검_4타공격/3타/01.png", "../../03_작업중/단검_4타공격/3타/02.png", "../../03_작업중/단검_4타공격/3타/03.png", "../../03_작업중/단검_4타공격/3타/04.png"], "ms": [50, 50, 110, 50], "poses": ["D1", "D2", "D3", "H3"], "reverse": false}, {"name": "4타 · 역수 마무리", "frames": ["../../03_작업중/단검_4타공격/4타/01.png", "../../03_작업중/단검_4타공격/4타/02.png", "../../03_작업중/단검_4타공격/4타/03.png", "../../03_작업중/단검_4타공격/4타/04.png"], "ms": [55, 200, 90, 65], "poses": ["D1", "D2", "H2", "H3"], "reverse": true}];const $=id=>document.getElementById(id);const pics={};const effectData=[{"frames": ["../../03_작업중/단검_4타공격/이펙트/1타/01.png", "../../03_작업중/단검_4타공격/이펙트/1타/02.png", "../../03_작업중/단검_4타공격/이펙트/1타/03.png", "../../03_작업중/단검_4타공격/이펙트/1타/04.png", "../../03_작업중/단검_4타공격/이펙트/1타/05.png", "../../03_작업중/단검_4타공격/이펙트/1타/06.png"], "ms": [18, 22, 28, 34, 30, 24], "start": 45, "name": "몸을 가로지르는 잔상"}, {"frames": ["../../03_작업중/단검_4타공격/이펙트/2타/01.png", "../../03_작업중/단검_4타공격/이펙트/2타/02.png", "../../03_작업중/단검_4타공격/이펙트/2타/03.png", "../../03_작업중/단검_4타공격/이펙트/2타/04.png", "../../03_작업중/단검_4타공격/이펙트/2타/05.png", "../../03_작업중/단검_4타공격/이펙트/2타/06.png"], "ms": [18, 22, 28, 34, 30, 24], "start": 45, "name": "크게 감아올리기"}, {"frames": ["../../03_작업중/단검_4타공격/이펙트/3타/01.png", "../../03_작업중/단검_4타공격/이펙트/3타/02.png", "../../03_작업중/단검_4타공격/이펙트/3타/03.png", "../../03_작업중/단검_4타공격/이펙트/3타/04.png", "../../03_작업중/단검_4타공격/이펙트/3타/05.png", "../../03_작업중/단검_4타공격/이펙트/3타/06.png"], "ms": [18, 22, 28, 34, 30, 24], "start": 100, "name": "전신 내려베기"}, {"frames": ["../../03_작업중/단검_4타공격/이펙트/4타/01.png", "../../03_작업중/단검_4타공격/이펙트/4타/02.png", "../../03_작업중/단검_4타공격/이펙트/4타/03.png", "../../03_작업중/단검_4타공격/이펙트/4타/04.png", "../../03_작업중/단검_4타공격/이펙트/4타/05.png", "../../03_작업중/단검_4타공격/이펙트/4타/06.png"], "ms": [18, 22, 28, 34, 30, 24], "start": 255, "name": "역수 큰 절단"}];const paths=['../../03_작업중/단검_4타공격/대기.png',...data.flatMap(v=>v.frames),...effectData.flatMap(v=>v.frames)];const ready=Promise.all(paths.map(p=>{let i=new Image();i.src=p+'?revision=user-retouch-fx';pics[p]=i;return i.decode()}));let hit=0,state='idle',time=0,queued=false,auto=false,last=0,manual=null;let fxEvents=[],clock=0,fired=false;function start(h){fired=false;hit=h;state='attack';time=0;queued=false;manual=null}function press(){if(state==='attack'){if(hit<3)queued=true}else if(state==='wait')start(hit+1);else start(0)}function update(dt){if(manual)return;clock+=dt;fxEvents=fxEvents.filter(e=>clock-e.at<156);let before=time;time+=dt;if(state==='attack'&&!fired&&time>=effectData[hit].start){fxEvents.push({hit,at:clock-(time-effectData[hit].start)});fired=true;}if(state==='attack'){let total=data[hit].ms.reduce((a,b)=>a+b,0);if(time>=total){if(hit<3&&(queued||auto))start(hit+1);else{state=hit<3?'wait':'recover';time=0}}}else if(state==='wait'&&time>=300){state='recover';time=0}else if(state==='recover'&&time>=100){state='idle';auto=false;time=0}}function path(){if(manual)return manual;if(state==='idle')return '../../03_작업중/단검_4타공격/대기.png';let d=data[hit];if(state!=='attack')return state==='wait'?d.frames.at(-1):'../../03_작업중/단검_4타공격/대기.png';let t=time;for(let i=0;i<d.ms.length;i++){if(t<d.ms[i])return d.frames[i];t-=d.ms[i]}return d.frames.at(-1)}const c=$('view').getContext('2d');c.imageSmoothingEnabled=false;function draw(){c.fillStyle='#465161';c.fillRect(0,0,768,640);c.fillStyle='#8998a8';c.fillRect(0,548,768,4);c.drawImage(pics[path()],0,0,768,640);if($('effects').checked){if(manual){let h=data.findIndex(d=>d.frames.includes(manual)),n=h<0?-1:data[h].frames.indexOf(manual);if(h>=0&&data[h].ms.slice(0,n).reduce((a,b)=>a+b,0)>=effectData[h].start)c.drawImage(pics[effectData[h].frames[2]],0,0,768,640);}else for(const e of fxEvents){let age=clock-e.at,k=0;while(k<5&&age>=effectData[e.hit].ms[k])age-=effectData[e.hit].ms[k++];c.drawImage(pics[effectData[e.hit].frames[k]],0,0,768,640);}}$('status').textContent=manual?'프레임 확인':state==='idle'?'대기':data[hit].name+(state==='wait'?' · 다음 입력 대기':'')+(queued?' · 예약됨':'')}function tick(t){let dt=last?Math.min(60,t-last)*+$('speed').value:0;last=t;update(dt);draw();requestAnimationFrame(tick)}$('attack').onclick=press;$('view').onclick=press;$('auto').onclick=()=>{auto=true;fxEvents=[];start(0)};$('reset').onclick=()=>{state='idle';manual=null;auto=false;queued=false;time=0;fxEvents=[]};window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['BUTTON','SELECT'].includes(e.target.tagName)){e.preventDefault();press()}});data.forEach((d,h)=>{let b=document.createElement('button');b.textContent=d.name;b.onclick=()=>{auto=false;fxEvents=[];start(h)};$('hits').append(b);d.frames.forEach((p,n)=>{let f=document.createElement('button');f.textContent=(h+1)+'타 '+(n+1)+'F';f.onclick=()=>{manual=p;auto=false;queued=false};$('frames').append(f)})});ready.then(()=>requestAnimationFrame(tick)).catch(e=>$('status').textContent=e.message);</script></html>
