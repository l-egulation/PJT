<!doctype html><html lang="ko"><meta charset="utf-8"><title>중앙 잉크 폭발 검토</title><style>body{margin:24px;background:#18232d;color:#e8e8ed;font:16px system-ui}main{max-width:1000px;margin:auto}h1{font-size:24px}p{color:#c3ced8;line-height:1.7}button,a{display:inline-block;padding:10px;margin:5px;color:#e8d7ef;background:#33404f;border:1px solid #788797}canvas{display:block;max-width:100%;image-rendering:pixelated;margin:14px 0}img{width:100%;image-rendering:pixelated}</style><main><h1>중앙 잉크 폭발</h1><p>발판 너비 96px × 높이 64px · 1초 전조 뒤 폭발 · 피해는 폭발 순간 1회.<br>압축 → 수직 돌파 → 꼭대기 분산 → 압력 차단·낙하. 실제 크기와 픽셀 확대를 나란히 비교합니다. 디자인 시안 및 합성 미리보기 · Unity 적용 전.</p><button id="replay">처음부터 보기</button><button id="peak">폭발 순간 고정</button><a href="../../?effect=burst">1페이즈 조작 테스트</a><canvas width="960" height="420"></canvas><p id="status"></p><img src="pressure-v3/frames.png" alt="부풀기부터 붕괴까지 16개 압력 분출 프레임"></main><script type="module">
import {drawBurst} from './burst.mjs?v=3';
const load=p=>new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=()=>j(Error(p));i.src=p});
const [map,terrain,...frames]=await Promise.all(['../../../map-preview/assets/D.png','../../../map-preview/assets/terrain-preview.png',...Array.from({length:16},(_,i)=>'pressure-v3/'+String(i).padStart(2,'0')+'.png')].map(load));
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let start=performance.now(),hold=false;
document.querySelector('#replay').onclick=()=>{start=performance.now();hold=false};document.querySelector('#peak').onclick=()=>hold=!hold;
function draw(now){const age=hold?1.10:((now-start)/1000)%3;ctx.imageSmoothingEnabled=false;ctx.drawImage(map,0,0,960,420);ctx.fillStyle='rgba(12,19,29,.85)';ctx.fillRect(12,10,936,40);ctx.font='18px system-ui';ctx.fillStyle='#ead9ef';ctx.fillText('실제 크기 1×                                      픽셀 확대 3×',30,37);
for(const [left,foot,s] of [[110,300,1],[480,336,3]]){ctx.drawImage(terrain,128,192,96,16,left,foot,96*s,16*s);if(age<1){ctx.fillStyle='rgba(155,90,185,.22)';ctx.fillRect(left,foot-64*s,96*s,64*s);ctx.strokeStyle='#ae78ca';ctx.lineWidth=1;ctx.strokeRect(left+.5,foot-64*s+.5,96*s-1,64*s-1)}drawBurst(ctx,frames,left,foot,age,s)}
document.querySelector('#status').textContent=age<1?'전조 · 바닥에서 압력 축적':age<1.31?'폭발 · 15 피해 1회':age<1.68?'무너져 내리는 잉크 · 추가 피해 없음':'다음 반복 대기';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
