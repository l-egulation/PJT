server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /admin {
    return 308 $scheme://$http_host/admin/;
  }

  location /admin/ {
    proxy_pass http://admin-console:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location /api/ {
    proxy_pass http://game-api:8080;
    proxy_http_version 1.1;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location = /ws/chat {
    proxy_pass http://game-api:8080/ws/chat;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /actuator/ {
    return 404;
  }

  location /assets/ {
    include /etc/nginx/auth/basic-auth.conf;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    include /etc/nginx/auth/basic-auth.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }

  error_page 500 502 503 504 =502 /deployment.html;
  location = /deployment.html {
    internal;
    add_header Cache-Control "no-store" always;
  }
}
