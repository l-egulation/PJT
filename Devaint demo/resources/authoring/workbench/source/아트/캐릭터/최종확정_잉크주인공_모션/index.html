<!doctype html><meta charset="utf-8"><title>잉크 주인공 픽셀 편집기</title>
<style>body{margin:24px;background:#20252b;color:#ecf0f4;font:15px system-ui}h1{font-size:25px}button,select{padding:9px;margin:3px;background:#394655;color:white;border:1px solid #617082;border-radius:6px;cursor:pointer}.active{outline:2px solid #efbf53}.layout{display:grid;grid-template-columns:minmax(550px,1fr) 340px;gap:22px}.panel{background:#2b333e;padding:16px;border-radius:12px}.board{overflow:auto;max-height:76vh;background:#707070}canvas{image-rendering:pixelated}#edit{touch-action:none;cursor:crosshair;display:block}.swatch{width:39px;height:39px;padding:0}.frames{display:grid;grid-template-columns:repeat(6,1fr)}.frames button{padding:6px}.frames canvas{width:40px;height:40px;background:#707070}p{line-height:1.6;color:#bdcbd8}a{color:#9bd8ff}#status{color:#f2ce7c}input{max-width:100%}@media(max-width:950px){.layout{grid-template-columns:1fr}}</style>
<h1>잉크 주인공 · 최종 확정 픽셀 편집기</h1><p>동작과 프레임을 고른 후 픽셀을 클릭하거나 드래그하세요. 원본 6색만 사용합니다. 수정 내용은 이 브라우저에 자동 저장되며, 원본 PNG 파일은 덮어쓰지 않습니다. 다른 곳에서도 이어 작업하려면 전체 작업 JSON을 저장하세요.</p>
<div class="layout"><div class="panel"><select id="motion"></select><span id="frameLabel"></span><label> 확대 <select id="zoom"><option>4</option><option selected>6</option><option>8</option><option>10</option><option>12</option></select>배</label><label><input id="grid" type="checkbox" checked>격자</label><div class="board"><canvas id="edit" width="768" height="768"></canvas></div><div id="status">준비</div></div><div class="panel"><h3>도구</h3><button data-tool="pen">칠하기 P</button><button data-tool="erase">지우기 E</button><button data-tool="pick">스포이드 I</button><button data-tool="fill">영역 채우기 F</button><p>우클릭 / Alt+클릭: 스포이드<br>채우기: 연결된 같은 색 영역을 채움</p><div id="palette"></div><p id="colorLabel"></p><button id="undo">되돌리기 Ctrl+Z</button><button id="redo">다시 실행 Ctrl+Y</button><h3>프레임 선택</h3><div class="frames" id="frames"></div><h3>동작별 속도 미리보기</h3><canvas id="preview" width="128" height="128" style="width:256px;height:256px;background:#707070"></canvas><br><button id="play">재생 / 다시 재생</button><h3>저장</h3><button id="png">현재 프레임 PNG</button><button id="sheet">동작 12프레임 시트 PNG</button><button id="save">전체 작업 JSON 저장</button><p>저장 파일은 브라우저의 다운로드 위치에 저장됩니다.</p><label>작업 JSON 불러오기<input id="load" type="file" accept=".json"></label><hr><button id="reset">현재 프레임 원본 복원</button><p><a id="inspect" target="_blank">현재 최종본 확대 보기</a></p></div></div>
<script src="편집데이터.js"></script><script src="재생설정.js?v=attack105"></script><script>
const $=id=>document.getElementById(id),key='ink-pixel-editor-final-playback-20261011-v3',decode=s=>Uint8ClampedArray.from(atob(s),c=>c.charCodeAt(0)),encode=a=>{let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode(...a.subarray(i,i+8192));return btoa(s)};
let project=structuredClone(INITIAL);try{let saved=JSON.parse(localStorage.getItem(key));if(saved&&saved.version===1)project=saved.frames}catch(e){}
let arrays=Object.fromEntries(Object.entries(project).map(([k,v])=>[k,v.map(decode)])),name=Object.keys(arrays)[0],frame=0,tool='pen',color=PALETTE[0],history=[],future=[],drawing=false,lastPoint=null,playing=false,pf=0,stamp=0;
const scratch=document.createElement('canvas');scratch.width=scratch.height=128;function drawNative(c,a){const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.putImageData(new ImageData(a,128,128),0,0)}
function persist(){try{let frames=Object.fromEntries(Object.entries(arrays).map(([k,v])=>[k,v.map(encode)]));localStorage.setItem(key,JSON.stringify({version:1,frames}));$('status').textContent='수정 자동 저장됨'}catch(e){$('status').textContent='자동 저장 불가: 전체 작업 JSON으로 저장하세요'}}
function render(){let z=+$('zoom').value,c=$('edit');c.width=c.height=128*z;drawNative(scratch,arrays[name][frame]);let ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#707070';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(scratch,0,0,c.width,c.height);if($('grid').checked){ctx.strokeStyle='rgba(0,0,0,.17)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<=128;i++){ctx.moveTo(i*z+.5,0);ctx.lineTo(i*z+.5,c.height);ctx.moveTo(0,i*z+.5);ctx.lineTo(c.width,i*z+.5)}ctx.stroke()}$('frameLabel').textContent=` ${frame+1} / 12`;$('inspect').href=name+'/확대보기.png';document.querySelectorAll('#frames button').forEach((b,i)=>{b.classList.toggle('active',i===frame);drawNative(b.querySelector('canvas'),arrays[name][i])});if(!playing)drawNative($('preview'),arrays[name][frame])}
for(let n of Object.keys(arrays))$('motion').add(new Option(n,n));$('motion').value=name;$('motion').onchange=()=>{name=$('motion').value;frame=0;playing=false;render()};for(let i=0;i<12;i++){let b=document.createElement('button');b.innerHTML=`<canvas width="128" height="128"></canvas><br>${i+1}`;b.onclick=()=>{frame=i;playing=false;render()};$('frames').append(b)}
function choose(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t))}document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>choose(b.dataset.tool));choose('pen');function setColor(c){color=c;$('colorLabel').textContent=c;document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.title===c))}for(let c of PALETTE){let b=document.createElement('button');b.className='swatch';b.title=c;b.style.background=c;b.onclick=()=>{setColor(c);choose('pen')};$('palette').append(b)}setColor(color);
function pos(e){let r=$('edit').getBoundingClientRect();return [Math.min(127,Math.max(0,Math.floor((e.clientX-r.left)/r.width*128))),Math.min(127,Math.max(0,Math.floor((e.clientY-r.top)/r.height*128)))]}function snapshot(){history.push({name,frame,data:arrays[name][frame].slice()});if(history.length>100)history.shift();future=[]}function rgba(){return [...color.slice(1).match(/../g).map(x=>parseInt(x,16)),255]}function paint(x,y){let a=arrays[name][frame],p=(y*128+x)*4;a.set(tool==='erase'?[0,0,0,0]:rgba(),p)}function pick(x,y){let a=arrays[name][frame],p=(y*128+x)*4;if(!a[p+3]){$('status').textContent='투명 픽셀';return}setColor('#'+[...a.slice(p,p+3)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase());choose('pen')}
function flood(x,y){let a=arrays[name][frame],target=[...a.slice((y*128+x)*4,(y*128+x)*4+4)],replacement=rgba(),q=[[x,y]],seen=new Set();while(q.length){let [x,y]=q.pop();if(x<0||y<0||x>=128||y>=128)continue;let n=y*128+x;if(seen.has(n))continue;seen.add(n);let p=n*4;if(!target.every((v,i)=>a[p+i]===v))continue;a.set(replacement,p);q.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}}
$('edit').oncontextmenu=e=>e.preventDefault();$('edit').onpointerdown=e=>{e.preventDefault();playing=false;let [x,y]=pos(e);if(tool==='pick'||e.button===2||e.altKey){pick(x,y);return}snapshot();if(tool==='fill'){flood(x,y);persist();render();return}drawing=true;lastPoint=[x,y];$('edit').setPointerCapture(e.pointerId);paint(x,y);render()};$('edit').onpointermove=e=>{if(!drawing)return;let [x,y]=pos(e),[a,b]=lastPoint,steps=Math.max(Math.abs(x-a),Math.abs(y-b));for(let i=0;i<=steps;i++)paint(Math.round(a+(x-a)*i/(steps||1)),Math.round(b+(y-b)*i/(steps||1)));lastPoint=[x,y];render()};function end(){if(drawing){drawing=false;persist()}}$('edit').onpointerup=end;$('edit').onpointercancel=end;
function travel(from,to){end();let s=from.pop();if(!s)return;to.push({name:s.name,frame:s.frame,data:arrays[s.name][s.frame].slice()});arrays[s.name][s.frame]=s.data;name=s.name;frame=s.frame;$('motion').value=name;playing=false;persist();render()}$('undo').onclick=()=>travel(history,future);$('redo').onclick=()=>travel(future,history);$('zoom').onchange=render;$('grid').onchange=render;document.onkeydown=e=>{if(/INPUT|SELECT/.test(e.target.tagName))return;if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();travel(history,future)}else if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();travel(future,history)}else if({p:'pen',e:'erase',i:'pick',f:'fill'}[e.key.toLowerCase()])choose({p:'pen',e:'erase',i:'pick',f:'fill'}[e.key.toLowerCase()])};
function download(blob,file){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}$('png').onclick=()=>{drawNative(scratch,arrays[name][frame]);scratch.toBlob(b=>download(b,`${name}_${String(frame+1).padStart(2,'0')}.png`))};$('sheet').onclick=()=>{let c=document.createElement('canvas');c.width=512;c.height=384;let ctx=c.getContext('2d');arrays[name].forEach((a,i)=>{drawNative(scratch,a);ctx.drawImage(scratch,i%4*128,Math.floor(i/4)*128)});c.toBlob(b=>download(b,`${name}_12f_128px.png`))};$('save').onclick=()=>download(new Blob([JSON.stringify({version:1,frames:Object.fromEntries(Object.entries(arrays).map(([k,v])=>[k,v.map(encode)]))})],{type:'application/json'}),'잉크모션_픽셀편집_작업.json');$('load').onchange=async e=>{try{let p=JSON.parse(await e.target.files[0].text());if(p.version!==1)throw Error();let next={};for(let n of Object.keys(INITIAL)){if(p.frames[n]?.length!==12)throw Error();next[n]=p.frames[n].map(s=>{let a=decode(s);if(a.length!==65536)throw Error();for(let i=0;i<a.length;i+=4){if(a[i+3]===0)continue;let c='#'+[...a.slice(i,i+3)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();if(a[i+3]!==255||!PALETTE.includes(c))throw Error()}return a})}arrays=next;history=[];future=[];playing=false;persist();render()}catch(e){alert('이 편집기에서 저장한 6색 작업 JSON을 선택해주세요.')}};$('reset').onclick=()=>{if(confirm('현재 프레임만 편집 시작 상태로 복원할까요?')){snapshot();arrays[name][frame]=decode(INITIAL[name][frame]);persist();render()}};$('play').onclick=()=>{playing=!playing;pf=0;stamp=performance.now();if(playing)drawNative($('preview'),arrays[name][0])};function tick(t){if(playing){const cfg=PLAYBACK[name];let duration=cfg.durations_ms[pf];while(playing&&t-stamp>=duration){stamp+=duration;if(pf===11){if(cfg.loop)pf=0;else playing=false}else pf++;drawNative($('preview'),arrays[name][pf]);duration=cfg.durations_ms[pf]}}requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script>
