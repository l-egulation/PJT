<!doctype html><html lang="ko"><meta charset="utf-8"><title>단검 역수 시험</title><style>body{background:#19232c;color:#eee;font:18px system-ui;margin:25px auto;max-width:1200px}img,canvas{image-rendering:pixelated;max-width:100%}button{padding:12px;margin:5px}canvas{background:#465161}</style><h2>기존 내려베기 · 4프레임 역수 시험</h2><p>4프레임은 복귀 자세입니다. 칼을 뒤집은 모습 비교이며, 역수 타격 모션 확정본은 아닙니다.</p><img src="4프레임_비교.png"><p id="buttons"></p><canvas id="c" width="640" height="640"></canvas><script>const names=['01','02','03','04','04_역수'];const c=document.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;names.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{let im=new Image();im.onload=()=>{c.clearRect(0,0,640,640);c.drawImage(im,0,0,640,640)};im.src='../../01_참고자료/단검_역수시험/'+n+'.png'};document.querySelector('#buttons').append(b)});document.querySelector('button').click();</script></html>
