<!doctype html><html lang="ko"><meta charset="utf-8"><title>로즈 선행 사망 · 흡수 컷씬</title><style>*{box-sizing:border-box}body{margin:0;background:#191c25;color:#eee;font:16px system-ui}main{max-width:1200px;margin:24px auto;padding:0 20px}h1{font-size:24px}button,select{font:inherit;padding:9px 14px;background:#353b4b;color:white;border:1px solid #687185;border-radius:6px;cursor:pointer}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.stage{position:relative;width:100%;aspect-ratio:16/9;background:#282f31}canvas{width:100%;height:100%;image-rendering:pixelated}.bubble{position:absolute;background:#fffaf0;color:#302936;border:2px solid #403747;border-radius:14px;padding:12px 18px;max-width:38%;font-weight:650;box-shadow:0 3px 0 #0004;transform:translate(-50%,-100%);white-space:pre-line}.bubble:after{content:'';position:absolute;bottom:-12px;left:40%;border:6px solid transparent;border-top-color:#fffaf0}input{flex:1;min-width:180px}small,p{color:#b9c0cc}.note{font-size:14px}#status{color:#f2c1d8}</style><main><h1>로즈 선행 사망 → 블루 흡수</h1><p><a href="lineup.html" style="color:#efb6d9">모든 모션·기본 자세 나란히 비교 →</a></p><p>디자인·연출 합성 미리보기 · 승인 모션 사용 · 임시 대사 · Unity 미적용</p><div class="stage"><canvas id="c" width="960" height="540"></canvas><div id="bubble" class="bubble" hidden></div></div><div class="controls"><button id="restart">처음부터</button><button id="pause">일시정지</button><select id="jump"><option value="0">① 로즈 쓰러짐</option><option value="0.9">② 블루 낙하·착지</option><option value="2.62">③ 로즈 대사</option><option value="4.15">④ 블루 대사</option><option value="5.7">⑤ 흡수</option><option value="7.8">⑥ 포효·강화</option></select><label><input type="checkbox" id="loop"> 반복</label></div><div class="controls"><input id="seek" type="range" min="0" max="10.5" step="0.01" value="0"><span id="status">불러오는 중</span></div><p class="note">로즈는 쓰러진 자세로 말하고, 블루는 착지 후 같은 자리에서 흡수합니다. 마지막 장면에서 자동 정지합니다. 흡수 이펙트는 타이밍 확인용 코드 시안입니다.</p></main><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),bubble=document.querySelector('#bubble'),seek=document.querySelector('#seek'),status=document.querySelector('#status');g.imageSmoothingEnabled=false;
const assets={},names=['room','rose-idle','blue-idle','blue-roar-01','fused-blue-idle','fused-blue-arrival-04','player',...Array.from({length:8},(_,i)=>'rose-'+i+'-approved94'),...Array.from({length:8},(_,i)=>'landing-'+i),...Array.from({length:16},(_,i)=>'recover-'+(i+21))];let landing=[],time=0,playing=true,last=0,ready=false;
const roseX=420,blueX=565,ground=445;
function sprite(n,x,y,alpha=1){g.globalAlpha=alpha;g.drawImage(assets[n],Math.round(x-192),Math.round(y-232));g.globalAlpha=1}
function say(text,x,y){bubble.hidden=false;bubble.textContent=text;bubble.style.left=x/9.6+'%';bubble.style.top=y/5.4+'%'}
function findFrame(seq,t){let acc=0;for(let i=0;i<seq.length;i++){acc+=seq[i]/1000;if(t<acc)return i}return seq.length-1}
function render(){g.clearRect(0,0,960,540);g.drawImage(assets.room,0,0);bubble.hidden=true;let phase='로즈 쓰러짐';const t=time;
 sprite('player',155,ground);
 let ri=t<0.79?findFrame([350,90,60,40,40,120,90,900],t):7;
 const absorb=Math.max(0,Math.min(1,(t-5.7)/2.1));
 if(absorb===0)sprite('rose-'+ri+'-approved94',roseX,ground);else if(absorb<1){g.save();for(let sy=110;sy<235;sy+=3){let k=(Math.sin(sy*13.7)*.5+.5);let start=k*.65;if(absorb<start)g.drawImage(assets['rose-7-approved94'],0,sy,384,3,roseX-192,ground-232+sy,384,3);else if(absorb<start+.2){g.globalAlpha=1-(absorb-start)/.2;g.drawImage(assets['rose-7-approved94'],0,sy,384,3,roseX-192+(absorb-start)*180,ground-232+sy-(absorb-start)*75,384,3)}}g.restore()}
 if(t>=.9&&t<2.59){phase='블루 낙하·착지·회복';let q=t-.9,ld=landing.reduce((a,e)=>a+e.durationMs/1000,0);if(q<ld){let sum=0,e=landing[0];for(const z of landing){sum+=z.durationMs/1000;e=z;if(q<sum)break}sprite('landing-'+(e.sourceFrame-13),blueX,ground-e.lift)}else sprite('recover-'+Math.min(36,21+Math.floor((q-ld)/.08)),blueX,ground)}
 else if(t>=2.59&&t<7.8)sprite('recover-36',blueX,ground);
 if(t>=2.62&&t<4.15){phase='로즈 대사';say('뭐 하고 있어…\n빨리 도와!',roseX-15,ground-94)}
 if(t>=4.15&&t<5.7){phase='블루 대사';say('……이제 네 말대로 안 해.',blueX+38,ground-155)}
 if(t>=5.7&&t<7.8){phase='마력 흡수';for(let i=0;i<38;i++){let p=((t-5.7)*1.15+i/38)%1,seed=Math.sin(i*18.1),x=roseX+(blueX-roseX)*p,y=ground-58-75*p+Math.sin(p*Math.PI)*seed*30;g.fillStyle=i%3?'#b65e8c':'#e6a4d8';let s=i%4===0?3:2;g.fillRect(Math.round(x),Math.round(y),s,s)}g.strokeStyle='#b65e8c';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();g.moveTo(roseX,ground-50-i*10);g.bezierCurveTo(465,ground-130+Math.sin(t*9+i)*14,510,ground-60,blueX,ground-130);g.stroke()}}
 if(t>=7.8&&t<8.65){phase='블루 포효';sprite('blue-roar-01',blueX,ground-Math.round(Math.sin((t-7.8)*Math.PI/.85)*7));g.fillStyle='#9565b3';for(let i=0;i<8;i++){let p=(t-7.8)/.85;g.fillRect(blueX+Math.cos(i)*p*70,ground-90+Math.sin(i)*p*75,2,4)}}
 if(t>=8.65){phase=t<9.35?'강화형 등장':'강화 블루 · 컷씬 종료';sprite(t<9.35?'fused-blue-arrival-04':'fused-blue-idle',blueX,ground);if(t<8.79){g.fillStyle='rgba(225,194,244,'+(1-(t-8.65)/.14)+')';g.fillRect(0,0,960,540)}}
 g.fillStyle='#080a10';g.fillRect(0,0,960,34);g.fillRect(0,506,960,34);g.fillStyle='#c8c1d0';g.font='13px sans-serif';g.fillText('ROSE → BLUE · ABSORPTION PREVIEW',20,23);
 seek.value=t;status.textContent=t.toFixed(2)+'s / '+phase;
}
function tick(now){if(!last)last=now;if(ready&&playing){time+=Math.min(.05,(now-last)/1000);if(time>=10.5){time=10.5;if(document.querySelector('#loop').checked)time=0;else playing=false}}last=now;if(ready)render();document.querySelector('#pause').textContent=playing?'일시정지':'재생';requestAnimationFrame(tick)}
document.querySelector('#restart').onclick=()=>{time=0;playing=true};document.querySelector('#pause').onclick=()=>playing=!playing;seek.oninput=()=>{time=+seek.value;playing=false};document.querySelector('#jump').onchange=e=>{time=+e.target.value;playing=true};
Promise.all([Promise.all(names.map(n=>new Promise((res,rej)=>{let im=new Image;im.onload=()=>{assets[n]=im;res()};im.onerror=()=>rej(new Error(n));im.src='assets/'+n+'.png'}))),fetch('landing.json').then(r=>r.json()).then(v=>landing=v)]).then(()=>ready=true).catch(e=>status.textContent='에셋 로드 실패: '+e.message);requestAnimationFrame(tick);
</script></html>
