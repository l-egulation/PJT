components:
  schemas:
    AccountIdentity:
      type: object
      required:
        - accountId
        - characterId
        - email
        - nickname
        - level
        - experience
        - rice
      properties:
        accountId:
          $ref: '#/components/schemas/Uuid'
        characterId:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          maxLength: 320
          format: email
        nickname:
          type: string
          minLength: 1
          maxLength: 20
        level:
          type: integer
          format: int32
        experience:
          type: integer
          format: int64
        rice:
          type: integer
          format: int64
    AdminAccountDetail:
      type: object
      required:
        - account
        - commands
        - walletLedger
        - battles
      properties:
        account:
          $ref: '#/components/schemas/AdminAccountSummary'
        commands:
          type: array
          items:
            $ref: '#/components/schemas/AdminCommandSummary'
        walletLedger:
          type: array
          items:
            $ref: '#/components/schemas/AdminWalletLedgerSummary'
        battles:
          type: array
          items:
            $ref: '#/components/schemas/AdminBattleSessionSummary'
    AdminAccountSummary:
      type: object
      required:
        - accountId
        - characterId
        - email
        - nickname
        - stateVersion
        - createdAt
        - level
        - experience
        - rice
        - primaryMaterialType
        - currentStageId
        - repeatStageId
        - highestClearedStageId
        - inventoryStackCount
        - inventoryQuantity
        - equipmentSlotCount
        - skillCount
        - gemCount
        - cosmeticCount
        - activeGameSession
        - activeBattleSession
        - activeMarketOrderCount
        - unclaimedMailCount
      properties:
        accountId:
          $ref: '#/components/schemas/Uuid'
        characterId:
          $ref: '#/components/schemas/Uuid'
        email:
          type: string
          nullable: true
        nickname:
          type: string
        stateVersion:
          type: integer
          format: int64
        createdAt:
          $ref: '#/components/schemas/Instant'
        level:
          type: integer
          format: int32
        experience:
          type: integer
          format: int64
        rice:
          type: integer
          format: int64
        primaryMaterialType:
          type: string
          nullable: true
        currentStageId:
          type: string
          nullable: true
        repeatStageId:
          type: string
          nullable: true
        highestClearedStageId:
          type: string
          nullable: true
        inventoryStackCount:
          type: integer
          format: int64
        inventoryQuantity:
          type: integer
          format: int64
        equipmentSlotCount:
          type: integer
          format: int64
        skillCount:
          type: integer
          format: int64
        gemCount:
          type: integer
          format: int64
        cosmeticCount:
          type: integer
          format: int64
        activeGameSession:
          type: boolean
        activeBattleSession:
          type: boolean
        activeMarketOrderCount:
          type: integer
          format: int64
        unclaimedMailCount:
          type: integer
          format: int64
    AdminAuditEvent:
      type: object
      required:
        - auditId
        - occurredAt
        - operatorId
        - username
        - action
        - targetType
        - targetId
        - outcome
        - requestId
        - remoteAddress
        - mutation
        - reason
        - beforeSummary
        - afterSummary
        - idempotencyKey
      properties:
        auditId:
          $ref: '#/components/schemas/Uuid'
        occurredAt:
          $ref: '#/components/schemas/Instant'
        operatorId:
          type: string
          allOf:
            - $ref: '#/components/schemas/Uuid'
          nullable: true
        username:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          nullable: true
        outcome:
          type: string
        requestId:
          $ref: '#/components/schemas/Uuid'
        remoteAddress:
          type: string
        mutation:
          type: boolean
        reason:
          type: string
          nullable: true
        beforeSummary:
          type: string
          nullable: true
        afterSummary:
          type: string
          nullable: true
        idempotencyKey:
          type: string
          allOf:
