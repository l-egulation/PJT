// Text is rasterized at the display's physical resolution, above the 960x540 art.

  const w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr));
  if(this.canvas.width!==w)this.canvas.width=w;
  if(this.canvas.height!==h)this.canvas.height=h;
  this.dpr=dpr;this.scaleX=w/960;this.scaleY=h/540;

  this.drawCount=0;if(!this.enabled)return;

  c.textAlign=source.textAlign;c.textBaseline=source.textBaseline;c.globalAlpha=source.globalAlpha;

// Keep standalone speech previews usable when no high-resolution overlay is attached.

}
function coverSceneText(ctx,x,y,w,h){

}

// Baked native-resolution poses. Rendering copies a complete pixel frame 1:1;
// it never rotates, shears, filters or interpolates the source sprite at runtime.

  };

   const cv=document.createElement('canvas');cv.width=w+p*2;cv.height=h+p*2;
