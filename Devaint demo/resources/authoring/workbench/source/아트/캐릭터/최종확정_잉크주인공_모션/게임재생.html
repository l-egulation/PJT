<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>잉크 주인공 · 최종 모션 재생</title><style>body{background:#202933;color:#edf1f5;font:16px system-ui;margin:24px}main{max-width:900px;margin:auto}button,select{font:inherit;background:#354659;color:white;border:1px solid #6b7e91;padding:10px;border-radius:7px;margin:5px}canvas{width:100%;max-width:900px;image-rendering:pixelated}a{color:#a4dbff}p{line-height:1.7;color:#c0cfdd}label{display:inline-block;margin:10px}#status{color:#f4ce78}</style><main><h1>잉크 주인공 · 최종 확정</h1><p>공격 1.05초 · 8개 동작 · 각 12프레임</p><select id="motion" aria-label="동작"></select><button id="restart">처음부터 재생</button><button id="pause">일시 정지</button><label>프레임 <input id="scrub" type="range" min="1" max="12" value="1"></label><p id="status"></p><canvas id="stage" width="600" height="380"></canvas><p>대기·걷기·달리기는 반복, 점프·낙하착지·공격은 대기로 복귀, 죽음은 마지막 장면 유지.</p><p><a href="index.html">픽셀 편집기</a> · <a href="결과보기.html">전체 모션 보기</a> · <a href="애니메이션_재생설정.json" download>게임용 재생 설정</a></p></main><script src="편집데이터.js"></script><script src="재생설정.js?v=attack105"></script><script>
const $=id=>document.getElementById(id),sprites=Object.fromEntries(Object.entries(INITIAL).map(([m,fs])=>[m,fs.map(b=>{const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').putImageData(new ImageData(Uint8ClampedArray.from(atob(b),v=>v.charCodeAt(0)),128,128),0,0);return c})]));for(const m of Object.keys(INITIAL))$('motion').add(new Option(m.replace('_',' '),m));let motion='대기',elapsed=0,playing=true,manual=false,last=performance.now();function state(){if(manual)return {m:motion,f:+$('scrub').value-1,done:false};let cfg=PLAYBACK[motion],ds=cfg.durations_ms,t=elapsed;if(cfg.loop)t%=cfg.total_ms;else if(t>=cfg.total_ms){if(cfg.on_complete==='hold_last')return {m:motion,f:11,done:true};t=(t-cfg.total_ms)%PLAYBACK['대기'].total_ms;let f=0,idle=PLAYBACK['대기'].durations_ms;while(f<11&&t>=idle[f])t-=idle[f++];return {m:'대기',f,done:true}}let f=0;while(f<11&&t>=ds[f])t-=ds[f++];return {m:motion,f,done:false}}function render(){let s=state(),ctx=$('stage').getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#34414e';ctx.fillRect(0,0,600,380);ctx.fillStyle='#293440';ctx.fillRect(0,322,600,58);ctx.fillStyle='#60717d';ctx.fillRect(0,322,600,2);ctx.drawImage(sprites[s.m][s.f],150,80,256,256);$('status').textContent=s.m.replace('_',' ')+' · '+(s.f+1)+'/12 · '+(PLAYBACK[motion].total_ms/1000).toFixed(2)+'초'+(s.done?(s.m==='대기'?' · 대기 복귀':' · 마지막 장면 유지'):'');if(!manual)$('scrub').value=s.f+1}function restart(){elapsed=0;manual=false;playing=true;last=performance.now();$('pause').textContent='일시 정지';render()}$('restart').onclick=restart;$('motion').onchange=()=>{motion=$('motion').value;restart()};$('pause').onclick=()=>{if(manual){elapsed=PLAYBACK[motion].durations_ms.slice(0,+$('scrub').value-1).reduce((a,b)=>a+b,0);manual=false}playing=!playing;last=performance.now();$('pause').textContent=playing?'일시 정지':'계속 재생'};$('scrub').oninput=()=>{manual=true;playing=false;$('pause').textContent='계속 재생';render()};document.addEventListener('visibilitychange',()=>last=performance.now());function tick(now){if(playing&&!manual&&!document.hidden)elapsed+=Math.min(now-last,100);last=now;render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
