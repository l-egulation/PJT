spring:
  application:
    name: game-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hanjjak}
    username: ${DB_USER:hanjjak}
    password: ${DB_PASSWORD:local-only}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:16}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
    timeout: 7d
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${GMAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${GMAIL_TIMEOUT_MS:5000}
          writetimeout: ${GMAIL_WRITE_TIMEOUT_MS:5000}
hanjjak:
  offline-reward:
    test-all-accounts: ${OFFLINE_REWARD_TEST_ALL_ACCOUNTS:false}
    test-account-ids: ${OFFLINE_REWARD_TEST_ACCOUNT_IDS:}
    test-reward-multiplier: ${OFFLINE_REWARD_TEST_REWARD_MULTIPLIER:}
    test-grace-period-seconds: ${OFFLINE_REWARD_TEST_GRACE_PERIOD_SECONDS:}
    test-bucket-seconds: ${OFFLINE_REWARD_TEST_BUCKET_SECONDS:}
    test-accrual-cap-seconds: ${OFFLINE_REWARD_TEST_ACCRUAL_CAP_SECONDS:}
  gem-dungeon:
    # Applied v2 defaults. The former applied v1 and the beta source remain addressable by
    # GEM_DUNGEON_CONTENT_RESOURCE for replay, comparison, and rollback.
    rotation-period-seconds: ${GEM_DUNGEON_ROTATION_PERIOD_SECONDS:3600}
    content-resource: ${GEM_DUNGEON_CONTENT_RESOURCE:classpath:gem-dungeons/gem-dungeons-v2.json}
    content-authority: ${GEM_DUNGEON_CONTENT_AUTHORITY:applied}
    ticket:
      regen-seconds: ${GEM_TICKET_REGEN_SECONDS:3600}
      max-stock: ${GEM_TICKET_MAX_STOCK:3}
      initial-grant: ${GEM_TICKET_INITIAL_GRANT:3}
  chat:
    enabled: true
    websocket-relay-delay-ms: ${CHAT_WEBSOCKET_RELAY_DELAY_MS:500}
  api-security:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    absolute-session-lifetime: ${AUTH_ABSOLUTE_SESSION_LIFETIME:30d}
    authentication-rate-limit:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
      window: ${AUTH_RATE_LIMIT_WINDOW:1m}
    password-reset-rate-limit:
      max-requests: ${PASSWORD_RESET_RATE_LIMIT_MAX_REQUESTS:3}
      window: ${PASSWORD_RESET_RATE_LIMIT_WINDOW:15m}
    mutation-rate-limit:
      max-requests: ${MUTATION_RATE_LIMIT_MAX_REQUESTS:120}
      window: ${MUTATION_RATE_LIMIT_WINDOW:1m}
    legacy-battle-reward-api-enabled: ${BATTLE_COMPATIBILITY_API_ENABLED:false}
  cosmetics:
    gacha-hmac-secret: ${COSMETIC_GACHA_HMAC_SECRET:}
    gacha-hmac-key-id: ${COSMETIC_GACHA_HMAC_KEY_ID:}
  admin:
    gitlab:
      enabled: ${ADMIN_GITLAB_OAUTH_ENABLED:false}
      client-id: ${ADMIN_GITLAB_OAUTH_CLIENT_ID:}
      client-secret: ${ADMIN_GITLAB_OAUTH_CLIENT_SECRET:}
      authorization-uri: ${ADMIN_GITLAB_OAUTH_AUTHORIZATION_URI:https://lab.ssafy.com/oauth/authorize}
      token-uri: ${ADMIN_GITLAB_OAUTH_TOKEN_URI:https://lab.ssafy.com/oauth/token}
      user-uri: ${ADMIN_GITLAB_OAUTH_USER_URI:https://lab.ssafy.com/api/v4/user}
      scopes: [read_user]
      allowed-usernames: ${ADMIN_GITLAB_ALLOWED_USERNAMES:}
      public-base-url: ${ADMIN_GITLAB_PUBLIC_BASE_URL:${PUBLIC_ORIGIN:http://localhost:5173}}
      success-url: ${ADMIN_GITLAB_SUCCESS_URL:${PUBLIC_ORIGIN:http://localhost:5173}}
      failure-url: ${ADMIN_GITLAB_FAILURE_URL:${PUBLIC_ORIGIN:http://localhost:5173}}
      flow-lifetime: ${ADMIN_GITLAB_FLOW_LIFETIME:10m}
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    authentication-rate-limit:
      max-requests: ${ADMIN_AUTH_RATE_LIMIT_MAX_REQUESTS:5}
      window: ${ADMIN_AUTH_RATE_LIMIT_WINDOW:1m}
    session:
      absolute-lifetime: ${ADMIN_SESSION_ABSOLUTE_LIFETIME:8h}
      inactivity-timeout: ${ADMIN_SESSION_INACTIVITY_TIMEOUT:30m}
      secure-cookie: ${ADMIN_SESSION_COOKIE_SECURE:false}
    deployment:
      commit-sha: ${DEPLOY_COMMIT_SHA:local}
      content-version: ${CONTENT_VERSION:v1}
      content-authority: ${CONTENT_AUTHORITY:working}
  balance:
    active-version: ${BALANCE_ACTIVE_VERSION:progression-rebalance-v1}
  password-reset:
    public-base-url: ${PUBLIC_ORIGIN:https://localhost:5173}
    token-lifetime: ${PASSWORD_RESET_TOKEN_LIFETIME:30m}
    mail:
      from: ${GMAIL_USERNAME:}
      subject: ${PASSWORD_RESET_MAIL_SUBJECT:한짝 비밀번호 재설정}
  social-login:
    public-base-url: ${SOCIAL_LOGIN_PUBLIC_BASE_URL:${PUBLIC_ORIGIN:http://localhost:5173}}
    frontend-success-url: ${SOCIAL_LOGIN_SUCCESS_URL:${PUBLIC_ORIGIN:http://localhost:5173}}
    frontend-failure-url: ${SOCIAL_LOGIN_FAILURE_URL:${PUBLIC_ORIGIN:http://localhost:5173}}
    flow-lifetime: ${SOCIAL_LOGIN_FLOW_LIFETIME:10m}
    providers:
      google:
        enabled: ${GOOGLE_OAUTH_ENABLED:false}
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
        client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
        issuer: https://accounts.google.com
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
        scopes: [openid, email, profile]
        oidc: true
        pkce: true
      kakao:
        enabled: ${KAKAO_OAUTH_ENABLED:false}
        client-id: ${KAKAO_OAUTH_CLIENT_ID:}
        client-secret: ${KAKAO_OAUTH_CLIENT_SECRET:}
        issuer: https://kauth.kakao.com
        authorization-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
        scopes: [openid]
        oidc: true
        pkce: true
      naver:
        enabled: ${NAVER_OAUTH_ENABLED:false}
        client-id: ${NAVER_OAUTH_CLIENT_ID:}
        client-secret: ${NAVER_OAUTH_CLIENT_SECRET:}
        authorization-uri: https://nid.naver.com/oauth2.0/authorize
        token-uri: https://nid.naver.com/oauth2.0/token
        user-info-uri: https://openapi.naver.com/v1/nid/me
        scopes: []
        oidc: false
        pkce: false
      ssafy-gitlab:
        enabled: ${SSAFY_GITLAB_OAUTH_ENABLED:false}
        client-id: ${SSAFY_GITLAB_OAUTH_CLIENT_ID:}
        client-secret: ${SSAFY_GITLAB_OAUTH_CLIENT_SECRET:}
        issuer: https://lab.ssafy.com
        authorization-uri: https://lab.ssafy.com/oauth/authorize
        token-uri: https://lab.ssafy.com/oauth/token
        user-info-uri: https://lab.ssafy.com/oauth/userinfo
        jwk-set-uri: https://lab.ssafy.com/oauth/discovery/keys
        scopes: [openid, email, profile]
        oidc: true
        pkce: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: 30d
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
