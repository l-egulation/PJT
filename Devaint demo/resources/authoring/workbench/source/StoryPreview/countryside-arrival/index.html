<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시골 도착 · 할머니집</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#eee8d7;font:15px system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}main{width:min(100%,1100px);padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}h1{font-size:20px;font-weight:600;margin:0}small{color:#b5b6ad}.stage{position:relative;background:#0b0d12;display:flex;align-items:center;justify-content:center;overflow:hidden;aspect-ratio:16/9;width:100%}canvas{display:block;image-rendering:pixelated;max-width:100%;max-height:100%;width:960px;aspect-ratio:16/9;object-fit:contain}.stage:fullscreen{width:100vw;height:100vh;aspect-ratio:auto}.stage:fullscreen canvas{max-width:100vw;max-height:100vh}.stage:fullscreen .exit{display:block}.exit{display:none;position:absolute;right:16px;top:16px}.controls{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}button{background:#29322f;color:#eee8d7;border:1px solid #596052;padding:10px 16px;border-radius:4px;cursor:pointer;font:inherit}button:hover{background:#3b463b}button:focus-visible{outline:2px solid #e3bf68;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}#status{margin-left:auto;color:#c1c4b9}#message{font-size:13px;color:#9fa79f;margin:12px 0 0}#load{position:absolute;background:#17201eea;padding:16px}a{color:#e3bf68}
body.playing-screen{overflow:hidden}.stage.screen-mode{position:fixed;inset:0;z-index:1000;width:100vw;height:100vh;aspect-ratio:auto}.stage.screen-mode canvas{max-width:none;max-height:none;flex:none}.stage.screen-mode .exit{display:block}
</style>
<main><header><h1>도서관 출발 → 시골 도착</h1><small>게임 화면 → 영화 화면 전환</small></header>
<div class="stage" id="stage"><canvas id="game" width="960" height="540" aria-label="주인공이 할머니집으로 달려와 숨을 고르는 장면"></canvas><div id="load" role="status">장면을 불러오는 중…</div><button class="exit" id="exit">전체화면 닫기</button></div>
<div class="controls"><button id="replay" disabled>처음부터 · R</button><button id="pause" disabled>일시정지 · Space</button><button id="fullscreen">전체화면 · F</button><button id="transition-preview">출구 전환 바로 보기</button><span id="status" role="status" aria-live="polite">준비 중</span></div>
<p id="message">기록 확인 직후부터 시작 · E: 글자 완성 / 대화 닫기 · ← → / A D: 이동 · 왼쪽 통로로 나가면 시골 장면으로 전환됩니다.</p></main>
<script src="assets.js?v=library-exit-1"></script><script src="scene.js"></script><script src="transition.js?v=fixed-bars-2"></script><script src="player.js?v=cinematic-2"></script></html>
