<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연막 7번 · 앞부분 감쇠</title><style>body{margin:0;background:#142123;color:#f2f0e8;font:17px/1.7 'Malgun Gothic',sans-serif}main{max-width:720px;margin:auto;padding:32px}audio{width:100%}a{color:#a3e1c9}h2{font-size:19px}</style><main><h1>연막 7번 · 앞부분만</h1><p>거친 고역을 최대 4dB 부드럽게 줄이고 전체 RMS 음량은 유지했습니다. 0.78초 길이와 기존 감쇠를 유지합니다.</p><h2>수정본</h2><audio controls preload="none" src="../source/smoke-release-14/smoke14-07-smoother.wav"></audio><details><summary>고역 조정 전 비교</summary><audio controls preload="none" src="../source/smoke-release-13/smoke13-07-louder.wav"></audio></details><p>사용자 최종 확정 · 로컬 게임 적용 완료</p></main><script>const players=[...document.querySelectorAll('audio')];for(const a of players){a.volume=.7;a.onplay=()=>players.forEach(b=>{if(a!==b)b.pause()});}</script></html>
