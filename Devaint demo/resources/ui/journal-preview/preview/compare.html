<!doctype html><html lang="ko"><meta charset="utf-8"><title>채택 시안과 HTML 비교</title><style>body{background:#e7e1d5;font:15px sans-serif;margin:24px}a{color:inherit}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}img{width:100%}.live{position:relative;overflow:hidden;aspect-ratio:16/9}iframe{border:0;width:960px;height:540px;transform-origin:0 0}section{margin:32px 0}</style><h1>채택 시안과 현재 HTML</h1><p><a href="index.html">미리보기 열기</a></p><p>현재 수정 요청을 반영한 HUD와 일시정지는 최초 시안과 구성이 다릅니다.</p><img src="assets/reference/03-combat-map-menus.png" alt="채택 시안"><div class="pair"><section><h2>정비소</h2><div class="live"><iframe title="정비소" src="index.html?embed=1#shop"></iframe></div></section><section><h2>가방</h2><div class="live"><iframe title="가방" src="index.html?embed=1#bag"></iframe></div></section><section><h2>성장</h2><div class="live"><iframe title="성장" src="index.html?embed=1#growth"></iframe></div></section><section><h2>전투 HUD</h2><div class="live"><iframe title="전투 HUD" src="index.html?embed=1#combat"></iframe></div></section><section><h2>보스 HUD</h2><div class="live"><iframe title="보스 HUD" src="index.html?embed=1#boss"></iframe></div></section><section><h2>일시정지</h2><div class="live"><iframe title="일시정지" src="index.html?embed=1#pause"></iframe></div></section></div><script>new ResizeObserver(es=>es.forEach(e=>e.target.firstElementChild.style.transform='scale('+e.contentRect.width/960+')')).observe(document.querySelector('.live'));document.querySelectorAll('.live').forEach(e=>{new ResizeObserver(es=>es.forEach(x=>x.target.firstElementChild.style.transform='scale('+x.contentRect.width/960+')')).observe(e)})</script></html>
