<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>튜토리얼 시안 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202321;color:#f3e8cb;font:15px/1.5 system-ui,sans-serif}main{max-width:2000px;margin:auto;padding:24px}h1{font-size:23px;margin:0 0 4px}p{color:#b9c0b6;margin:0 0 18px}nav,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button{font:inherit;color:inherit;background:#323931;border:1px solid #4c5448;border-radius:6px;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#52533d;border-color:#d5c395}button:disabled{opacity:.35}button:focus-visible{outline:2px solid #e8ce8f;outline-offset:3px}.mode{margin-left:auto;display:flex;gap:8px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{min-width:0;border:1px solid #465044;border-radius:8px;overflow:hidden;background:#2c2d2c}.label{padding:12px 16px;border-bottom:1px solid #465044;font-weight:650}.label small{font-weight:400;color:#b9c0b6;margin-left:8px}.frame{aspect-ratio:536/312;position:relative;overflow:hidden}.frame img{image-rendering:pixelated;position:absolute;display:block;width:179.1044776%;max-width:none;left:-39.5522388%;top:-36.5384615%;height:auto}.full .frame{aspect-ratio:16/9}.full .frame img{image-rendering:pixelated;position:static;width:100%;height:100%;object-fit:contain}.controls{align-items:center}.controls span{color:#b9c0b6}a{color:#e0cfaa}.notes{font-size:12px;margin-top:12px}@media(max-width:680px){main{padding:14px}.columns{gap:6px}.label{padding:8px;font-size:13px}.label small{display:block;margin:0}.mode{margin-left:0}.controls button{padding:9px}.notes{font-size:11px}}
</style></head><body><main>
<h1>튜토리얼 시안 비교</h1><p>왼쪽 기존 시안 · 오른쪽 현재 에셋 조합</p>
<nav id="tabs" aria-label="페이지 선택"></nav>
<div class="controls"><button id="previous">← 이전</button><strong id="title"></strong><button id="next">다음 →</button><div class="mode"><button id="panel" aria-pressed="true">창 확대</button><button id="full" aria-pressed="false">전체 화면</button></div></div>
<section class="columns" id="comparison">
 <article class="card"><div class="label">기존 시안<small>확정 디자인</small></div><div class="frame"><img id="original" alt="기존 시안"></div></article>
 <article class="card"><div class="label">현재 조합<small>수정한 캐릭터·픽셀 에셋 적용</small></div><div class="frame"><img id="current" alt="현재 UI 조합"></div></article>
</section>
<div class="controls"><a id="pair" target="_blank">나란히 비교 PNG 열기</a><span>← / → 키로 페이지 이동</span></div>
<p class="notes">같은 화면·창 크기를 기준으로 정렬했습니다. 창 확대는 비교를 위한 표시이며 원본 이미지와 게임 에셋을 변경하지 않습니다.</p>
</main><script>
(()=>{'use strict';const pages=[['attack','공격'],['sketch','1. 스케치'],['ink','2. 잉크'],['palette','3. 팔레트'],['activation','4. 활성화'],['durability','5. 내구도']];let index=0;const $=id=>document.getElementById(id);pages.forEach(([id,title],i)=>{const b=document.createElement('button');b.textContent=title;b.onclick=()=>{index=i;render()};$('tabs').append(b)});function render(){const[id,title]=pages[index];$('title').textContent=title;$('original').src='mockups/'+id+'.png';$('current').src='current/'+id+'.png';$('original').alt=title+' 기존 시안';$('current').alt=title+' 현재 조합';$('pair').href='pairs/'+id+'.png';$('previous').disabled=index===0;$('next').disabled=index===pages.length-1;Array.from($('tabs').children).forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)))}function move(delta){index=Math.max(0,Math.min(pages.length-1,index+delta));render()}$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);function mode(full){$('comparison').classList.toggle('full',full);$('panel').setAttribute('aria-pressed',String(!full));$('full').setAttribute('aria-pressed',String(full))}$('panel').onclick=()=>mode(false);$('full').onclick=()=>mode(true);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}});render()})();
</script></body></html>
