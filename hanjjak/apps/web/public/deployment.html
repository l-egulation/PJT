<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한짝 · 배포중입니다</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    :root { color: #3d2518; background: #2b150a; font-family: Georgia, "Times New Roman", "Noto Serif KR", serif; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; overflow: hidden; }
    .scene { position: relative; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px 130px; overflow: hidden; background: linear-gradient(180deg, #a9673b 0 10%, #d8a76d 10% 60%, #71401e 60% 63%, #432414 63% 100%); }
    .scene::before { position: absolute; inset: 0; content: ""; opacity: .7; background: linear-gradient(90deg, rgba(47, 20, 7, .45), transparent 13% 87%, rgba(47, 20, 7, .45)), repeating-linear-gradient(0deg, transparent 0 74px, rgba(76, 39, 15, .24) 74px 78px), repeating-linear-gradient(90deg, transparent 0 118px, rgba(76, 39, 15, .2) 118px 122px); }
    .scene::after { position: absolute; right: -5%; bottom: 0; left: -5%; height: 40%; content: ""; background: repeating-linear-gradient(12deg, rgba(255, 214, 142, .08) 0 2px, transparent 2px 10px), linear-gradient(#885129, #5b311a); box-shadow: inset 0 16px 28px rgba(38, 17, 6, .45); }
    .shelf { position: absolute; z-index: 1; top: 12%; width: 20%; height: 9px; border: 3px solid #48220e; background: #a15e2d; box-shadow: 0 16px 0 -4px #48220e; }
    .shelf.left { left: -2%; transform: rotate(-2deg); }
    .shelf.right { right: -2%; transform: rotate(2deg); }
    .lantern { position: absolute; z-index: 1; top: -12px; right: 13%; width: 44px; height: 72px; border: 5px solid #3b1b0a; border-top: 0; border-radius: 0 0 18px 18px; background: radial-gradient(circle, #ffe7a6 0 25%, #e59d43 48%, #8a3f19 78%); box-shadow: 0 0 40px rgba(255, 193, 83, .8); }
    .maintenance-card { position: relative; z-index: 2; display: grid; justify-items: center; width: min(760px, 100%); min-height: 410px; padding: 68px clamp(28px, 7vw, 76px) 58px; border: 3px solid #9e6a3c; background: radial-gradient(circle at 22% 20%, rgba(255,255,255,.5), transparent 28%), #f5e4c3; box-shadow: 0 20px 35px rgba(42, 16, 4, .42), inset 0 0 0 7px rgba(255, 244, 214, .42), inset 0 0 35px rgba(134, 76, 31, .2); text-align: center; }
    .maintenance-card::before, .maintenance-card::after { position: absolute; right: 8%; left: 8%; height: 2px; content: ""; background: repeating-linear-gradient(90deg, #80512f 0 18px, transparent 18px 25px); opacity: .65; }
    .maintenance-card::before { top: 38px; }
    .maintenance-card::after { bottom: 36px; }
    .pin { position: absolute; top: -18px; left: 50%; width: 27px; height: 45px; border: 3px solid #603c25; border-radius: 5px 5px 9px 9px; background: linear-gradient(90deg, #d8a85f, #f1d28b 48%, #aa6c36); box-shadow: 0 4px 0 rgba(58, 26, 8, .25); transform: translateX(-50%) rotate(2deg); }
    .eyebrow { margin: 0 0 12px; color: #986234; font: 900 12px/1.2 Arial, sans-serif; letter-spacing: .18em; }
    .sprout { position: relative; width: 70px; height: 54px; margin-bottom: 10px; }
    .sprout::before { position: absolute; bottom: 1px; left: 50%; width: 5px; height: 35px; border-radius: 9px; content: ""; background: #6e5335; transform: rotate(8deg); }
    .sprout i { position: absolute; top: 2px; width: 29px; height: 19px; border-radius: 100% 0 100% 0; background: #6c8243; transform: rotate(-27deg); }
    .sprout i:first-child { left: 8px; }
    .sprout i:nth-child(2) { right: 7px; background: #82994d; transform: scaleX(-1) rotate(-27deg); }
    .sprout b { position: absolute; bottom: 0; left: 50%; width: 44px; height: 10px; border-radius: 50%; background: #9a693e; transform: translateX(-50%); }
    h1 { margin: 0; color: #3d2518; font-size: clamp(46px, 7vw, 78px); line-height: 1; letter-spacing: -.12em; text-shadow: 0 2px 0 rgba(255, 244, 211, .8); }
    .copy { margin: 20px 0 22px; color: #62432c; font-size: clamp(17px, 2vw, 22px); font-weight: 700; line-height: 1.7; }
    .progress { display: flex; gap: 9px; margin-bottom: 18px; }
    .progress i { width: 10px; height: 10px; border-radius: 50%; background: #d5b58a; animation: pulse 1.35s ease-in-out infinite; }
    .progress i:nth-child(2) { background: #b86d39; animation-delay: .18s; }
    .progress i:nth-child(3) { animation-delay: .36s; }
    .hint { color: #8a6344; font: 700 13px/1.4 Arial, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.15); } }
    @media (max-width: 560px) { .scene { padding: 24px 14px 100px; } .maintenance-card { min-height: 360px; padding: 58px 24px 48px; } h1 { font-size: clamp(40px, 13vw, 58px); } .copy { margin: 16px 0 18px; font-size: 16px; } .eyebrow { font-size: 10px; letter-spacing: .1em; } }
    @media (prefers-reduced-motion: reduce) { .progress i { animation: none; } }
  </style>
</head>
<body>
  <main class="scene" aria-labelledby="deployment-title">
    <div class="shelf left" aria-hidden="true"></div>
    <div class="shelf right" aria-hidden="true"></div>
    <div class="lantern" aria-hidden="true"></div>
    <section class="maintenance-card" role="status" aria-live="polite">
      <div class="pin" aria-hidden="true"></div>
      <p class="eyebrow">HANJJAK · SYSTEM UPDATE</p>
      <div class="sprout" aria-hidden="true"><i></i><i></i><b></b></div>
      <h1 id="deployment-title">배포중입니다</h1>
      <p class="copy">더 나은 한짝을 준비하고 있어요.<br>잠시 후 다시 접속해 주세요.</p>
      <div class="progress" aria-hidden="true"><i></i><i></i><i></i></div>
      <small class="hint">서비스가 준비되면 새로고침해 주세요.</small>
    </section>
  </main>
</body>
</html>
