<header><b>deviant / 임시 GUI · 실제 캡처 위 배치</b><span>원본 게임 캡처 유지 · 코드로 렌더링한 UI · 숫자와 문구는 별도 텍스트 · 게임 연결 전 미리보기</span></header>
<div class="board" id="board"></div><div class="notice" id="notice"></div><div class="export-page" id="parts"></div>
<script>
const pixels={
sword:'<path fill="#d1d5bc" d="M22 2h4v6h-4v4h-4v4h-4v4h-4v-4h4v-4h4V8h4z"/><path fill="#8b977a" d="M8 16h4v4h4v4h-4v-4H8z"/><path fill="#8c6747" d="M4 24h4v-4h4v4H8v4H4z"/>',
hammer:'<path fill="#8e6848" d="M12 12h4v16h-4z"/><path fill="#b5b5a0" d="M4 4h24v8H4z"/><path fill="#838d77" d="M4 12h24v4H4z"/><path fill="#d5d4bd" d="M8 4h16v4H8z"/>',
launcher:'<path fill="#9caa95" d="M5 9h24v8H17v5h-7v-5H5z"/><path fill="#566a5a" d="M2 10h5v7H2z"/><path fill="#947255" d="M10 19h6v10h-6z"/>',
ink:'<path fill="currentColor" d="M14 3h4v5h4v6h4v11h-4v4H10v-4H6V14h4V8h4z"/><path fill="#f5e4c0" d="M11 15h3v7h-3z"/>',
coin:'<path fill="#b29148" d="M8 4h16v4h4v16h-4v4H8v-4H4V8h4z"/><path fill="#e2c46d" d="M10 8h12v16H10z"/><path fill="#fff0a1" d="M10 8h4v12h-4z"/>',
heart:'<path fill="#c66559" d="M3 7h9v4h8V7h9v14h-4v4h-4v4H11v-4H7v-4H3z"/><path fill="#eb9b81" d="M6 10h4v7H6z"/>',
stamp:'<path fill="#cfcaad" d="M10 3h12v12H10zM6 16h20v8H6zM3 25h26v4H3z"/><path fill="#8b9b83" d="M11 18h10v3H11z"/>',
map:'<path fill="#b4c3a0" d="M2 8l9-5 10 4 9-4v23l-9 4-10-4-9 4z"/><path fill="#546a50" d="M10 5h2v22h-2zM20 7h2v21h-2z"/>'};
const icon=(name,color='')=>`<svg class="icon" viewBox="0 0 32 32" style="color:${color}" aria-hidden="true">${pixels[name]||pixels.ink}</svg>`;
const ink=(color)=>icon('ink',color);const button=(label,cls='')=>`<button class="button ${cls}" type="button">${label}</button>`;
const slot=(content='',selected=false)=>`<button class="slot ${selected?'selected':''}" type="button">${content}</button>`;
const miniMap=`<svg viewBox="0 0 160 75" width="160" height="75"><path d="M6 57H35V42H62V54H86V23H112V39H151" fill="none" stroke="#89977b" stroke-width="10"/><path d="M35 42V17H62M86 54V66H120" fill="none" stroke="#566a55" stroke-width="7"/><rect x="78" y="43" width="7" height="7" fill="#8fd4b6"/></svg>`;
const panels=[['01','전투 HUD','실제 크기 960 × 540',`<div class="health hud">${icon('heart')}<div><div class="gauge"><i></i></div><small>70 / 100</small></div></div><div class="coins hud">${icon('coin')} <span class="gold">240 G</span></div><button class="pause button">Ⅱ</button><div class="location">1챕터 · 마을</div><div class="toast hud">${ink('#c86456')} 붉은 잉크 획득</div><div class="weaponbar"><div class="quick hud"><div class="slot selected">${icon('sword')}</div><p><span class="key">S</span> 검</p></div><div class="quick hud"><div class="slot">${icon('hammer')}<span class="cooldown">3.2초</span></div><p><span class="key">Q</span> 망치</p></div><span class="pill">W 특수</span></div><div class="minimap hud">${miniMap}</div><button class="baghud button">가방 8 / 15 <span class="key">I</span></button>`],
['02','가방 · 장비','무기 2개 / 개별 아이템 15칸',`<div class="dim"></div><div class="inventory panel"><div class="panel-title"><span>가방 · 장비</span><div class="hbox"><span class="muted">8 / 15</span><button class="x">×</button></div></div><div class="inv-body"><div>${['검','망치'].map((name,w)=>`<div class="weapon-card card"><div class="weapon-top">${icon(w?'hammer':'sword')}<b>${name}</b><span class="muted">무기 ${w+1}</span></div><div class="equipment">${slot(icon('stamp'))}<span class="divider"></span>${Array.from({length:5},(_,i)=>slot(i<2?ink(i?'#bca45e':'#c86456'):'')).join('')}<span class="divider"></span>${slot(icon('stamp'))}</div><div class="equip-labels"><span>형태</span><span>능력치 5칸</span><span>특수</span></div></div>`).join('')}</div><div><div class="tabs">${['전체','형태','능력치','특수'].map((x,i)=>button(x,i?'':'primary')).join('')}</div><div class="baggrid">${Array.from({length:15},(_,i)=>slot(i<8?(i<5?ink(['#c86456','#c5aa59','#719b67','#6299b9','#9983ad'][i]):icon(i===5?'sword':'stamp')):'',i===0)).join('')}</div><div class="detail"><div class="hbox space"><b>붉은 잉크</b><span class="muted">능력치</span></div><div>기본 공격 피해 +20%</div><div class="hbox space"><span class="muted">개별 아이템 · 1칸 사용</span>${button('장착','primary')}</div></div></div></div><div class="inv-footer">정비소에서 장착·해제 가능 <span style="float:right">I / Esc 닫기</span></div></div>`],
['03','정비소','구매 · 강화 · 스탬프 교체',`<div class="dim"></div><div class="shop panel"><div class="panel-title"><span>정비소</span><div class="hbox gold">${icon('coin')}240 G <button class="x">×</button></div></div><div class="shop-body"><div><div class="hbox space" style="margin-bottom:10px"><b>팔레트 구매</b><span class="muted">시설 재고 2개</span></div><div class="offers">${[1,2].map(n=>`<div class="offer card"><b>팔레트 ${n}</b><div class="palette">${icon('map')}<span class="muted">구성 미정</span></div><span class="gold">80 G</span>${button('구매','primary')}</div>`).join('')}</div><div class="stamp-row card"><div class="hbox space"><span>스탬프 교체</span><span class="gold">20 G</span></div><div class="hbox" style="margin-top:12px">${slot(icon('sword'))}${slot(icon('stamp'))}<span class="muted">기존 스탬프 소멸</span></div></div></div><div>${[['잉크 뽑기','50 G','뽑기'],['캐릭터 강화','100 G','강화'],['팔레트 슬롯 강화','120 G','강화']].map(([a,b,c])=>`<div class="shoprow"><div><p>${a}</p><span class="gold">${b}</span></div>${button(c)}</div>`).join('')}<div class="shop-note">시험 가격 표시 예시<br>강화 효과·개별 파츠는 연결 예정</div><div class="line"></div><div class="muted">골드가 부족하면 거래할 수 없습니다.</div></div></div><div class="inv-footer">정비소 안에서만 이용 가능 <span style="float:right">E / Esc 닫기</span></div></div>`],
['04','시작 도면 선택','월드 안에서 접근 후 E 선택',`<div class="choice-hint hud">시작 도면 선택 <span class="teal">1 / 2</span><div class="muted" style="margin-top:5px">서로 다른 도면을 2개 선택하세요</div></div><div class="choices">${[['검','sword'],['둔기','hammer'],['원거리','launcher']].map(([n,i],k)=>`<div class="choice ${k===0?'selected':''}">${icon(i)}<b>${n}</b><small>${k===0?'슬롯 1 · 선택 완료':k===1?'슬롯 2에 장착':'가까이 이동'}</small>${k===1?'<span class="key">E 선택</span>':''}</div>`).join('')}</div><div class="hintbottom hud">2개 선택하면 남은 도면은 사라집니다</div>`],
['05','메뉴 · 결과','하단 버튼으로 화면 상태 전환',`<div class="dim"></div><div class="result panel" id="resultPanel"></div><div class="state-tabs">${['클리어','사망','일시정지','타이틀'].map((x,i)=>`<button class="button ${i===0?'primary':''}" data-state="${i}">${x}</button>`).join('')}</div>`],
['06','전체 지도','도식 미리보기 / 실제 맵 데이터 연결 예정',`<div class="dim"></div><div class="fullmap panel"><div class="panel-title"><span>전체 지도 <span class="muted">마을</span></span><div class="hbox">${button('+')}${button('−')}${button('M 닫기')}</div></div><svg class="map-svg" viewBox="0 0 916 348"><defs><pattern id="mapgrid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#bcbca166" stroke-width="1"/></pattern></defs><rect width="916" height="348" fill="url(#mapgrid)"/><g fill="#858e70" stroke="#4d614a" stroke-width="2"><path d="M54 209h110v-48h112v48h93v-32h114v32h97v-80h108v80h125v33H54z"/><path d="M181 130v-44h94v22h-72v22zM385 144V75h121v23h-98v46zM607 109V64h83v22h-61v23z"/></g><g fill="#eee5d1"><path d="M65 201h91v-48h127v48h79v-32h129v32h81v-80h125v80h107v14H680v-80h-92v80H475v-32h-99v32h-108v-48h-97v48H65z"/></g><g fill="#4e8f7b"><rect x="294" y="185" width="10" height="10"/><rect x="307" y="182" width="4" height="4"/></g><g fill="#b29047"><rect x="211" y="75" width="13" height="13"/></g><g fill="#a45b4e"><rect x="765" y="185" width="13" height="13"/></g><g font-family="game, sans-serif" font-size="12" fill="#35472e"><text x="260" y="270">現在位置</text><text x="195" y="65">정비소</text><text x="745" y="172">보스</text></g><rect x="815" y="0" width="101" height="348" fill="#b5b59caa"/><rect x="0" y="292" width="916" height="56" fill="#b5b59c88"/></svg><div class="map-footer"><span>현재 위치 · 마을</span><div class="legend"><span><i></i>현재 위치</span><span><i style="background:#b29047"></i>정비소</span><span><i style="background:#a45b4e"></i>보스</span></div></div><div class="map-footer" style="margin-top:14px"><span class="muted" style="color:#69765b">스크롤 확대 · 드래그 이동</span><span class="hbox" style="font-size:11px">보스 바 스타일 <span class="bossbar"><i></i></span></span></div></div>`]];
document.querySelector('#board').innerHTML=panels.map(([n,title,sub,html])=>`<section><div class="screen-label"><b>${n}</b>${title}<small>${sub}</small></div><div class="screen" id="screen-${n}">${html}</div></section>`).join('');
function resultState(n){const content=[`<h2>1챕터 클리어</h2><div class="result-stat"><span>플레이 시간</span><b>12:34</b></div><div class="result-stat"><span>처치 수</span><b>87</b></div>${button('2챕터 입구로','primary')}`,`<h2 class="red">사망</h2><div class="result-stat"><span>플레이 시간</span><b>08:17</b></div><div class="result-stat"><span>처치 수</span><b>43</b></div><div class="hbox">${button('다시 하기','primary')}${button('타이틀')}</div>`,`<h2>일시정지</h2><p class="muted">게임이 일시정지되었습니다.</p>${button('계속하기','primary')}${button('타이틀')}`,`<h2 style="font-size:35px;margin:12px 0 30px">deviant</h2>${button('새 게임','primary')}${button('종료')}`];document.querySelector('#resultPanel').innerHTML=`<div class="panel-title"><span>deviant</span><span class="muted">1챕터</span></div><div class="result-content">${content[n]}</div>`;document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('primary',+b.dataset.state===n))}resultState(0);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.state!==undefined){resultState(+b.dataset.state);return}if(b.classList.contains('slot')){const group=b.closest('.baggrid,.equipment');if(group){group.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}return}if(b.closest('.tabs')){b.parentNode.querySelectorAll('.primary').forEach(x=>x.classList.remove('primary'));b.classList.add('primary');return}const toast=document.querySelector('#notice');toast.textContent='GUI 미리보기 · 실제 게임 상태에는 연결하지 않았습니다';toast.style.display='block';clearTimeout(window.noticeTimeout);window.noticeTimeout=setTimeout(()=>toast.style.display='none',1800)});
const pieces=[['panel','panel'],['card','card'],['button','button'],['button-selected','button primary'],['button-disabled','button'],['slot','slot'],['slot-selected','slot selected'],['hp-track','track'],['hp-fill','fill'],['cooldown-fill','fill tealfill']];
document.querySelector('#parts').innerHTML=pieces.map(([id,cls])=>`<div id="asset-${id}" class="piece ${cls}"${id==='button-disabled'?' style="background:#262d28;border-color:#485046"':''}></div>`).join('')+Object.keys(pixels).map(n=>`<div id="asset-icon-${n}" class="piece" style="width:32px;height:32px;color:#c86456">${icon(n)}</div>`).join('')+['red','yellow','green','blue','purple'].map((n,i)=>`<div id="asset-ink-${n}" class="piece" style="width:32px;height:32px">${ink(['#c86456','#c5aa59','#719b67','#6299b9','#9983ad'][i])}</div>`).join('');
if(new URLSearchParams(location.search).has('export'))document.body.classList.add('export');
document.querySelector('.map-svg text').textContent='현재 위치';
</script></html>
