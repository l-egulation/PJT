apiVersion: v1
kind: Pod
metadata:
  name: deployment-smoke
  namespace: hanjjak
  labels:
    app.kubernetes.io/name: deployment-smoke
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: smoke
      image: curlimages/curl:8.22.0
      command: ["sh", "-c"]
      envFrom:
        - configMapRef:
            name: application-config
      env:
        - name: BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: application-secrets
              key: BASIC_AUTH_PASSWORD
              optional: true
      args:
        - >-
          set -eu;
          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 --retry 2 --retry-all-errors --retry-delay 1 http://web:8080/healthz >/dev/null;
          if [ "${BASIC_AUTH_ENABLED:-false}" = "true" ]; then
            curl --fail --silent --show-error --connect-timeout 3 --max-time 10 --retry 2 --retry-all-errors --retry-delay 1 -u "${BASIC_AUTH_USERNAME:-hanjjak}:${BASIC_AUTH_PASSWORD:-}" http://web:8080/ >/dev/null;
          else
            curl --fail --silent --show-error --connect-timeout 3 --max-time 10 --retry 2 --retry-all-errors --retry-delay 1 http://web:8080/ >/dev/null;
          fi;
          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 --retry 2 --retry-all-errors --retry-delay 1 -H 'Accept: application/json' http://web:8080/api/v1/auth/session >/dev/null;
          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 --retry 2 --retry-all-errors --retry-delay 1 http://game-api:8080/actuator/health/readiness >/dev/null;
          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 --retry 2 --retry-all-errors --retry-delay 1 http://admin-console:8080/healthz >/dev/null;
          curl --fail --silent --show-error --connect-timeout 3 --max-time 10 --retry 2 --retry-all-errors --retry-delay 1 http://web:8080/admin/ >/dev/null
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
