services:
  collector:
    build: .
    image: deviant-collector:local
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env or the shell}"
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      MAX_STORAGE_BYTES: "${MAX_STORAGE_BYTES:-2147483648}"
      PLAYER_DAILY_BYTES: "${PLAYER_DAILY_BYTES:-67108864}"
      RETENTION_DAYS: "${RETENTION_DAYS:-30}"
    volumes:
      - collector-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, run]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      collector:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64

volumes:
  collector-data:
