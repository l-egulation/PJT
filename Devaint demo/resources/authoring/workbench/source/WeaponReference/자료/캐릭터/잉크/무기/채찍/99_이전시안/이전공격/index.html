<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채찍 · 이전 공격 보존본</title><style>body{font:16px system-ui,'Malgun Gothic';max-width:1100px;margin:26px auto;padding:0 20px;background:#18222e;color:#edf2f5}a{color:#e3cb93}p{line-height:1.7;color:#bfccd6}button,select{font:inherit;background:#334a60;color:#edf2f5;border:1px solid #72899c;padding:10px 14px;border-radius:6px;cursor:pointer}button.active{background:#816b3d}nav{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:15px 0}canvas{width:100%;display:block;background:#455364;image-rendering:pixelated;border-radius:8px}input[type=range]{flex:1;min-width:180px}li{margin:8px 0}</style></head><body><p><a href="../../05_미리보기/index.html">← 확정 채찍 전체 모션</a> · <a href="../../05_미리보기/휘두름_궤적시안/비교.html">새 공격과 나란히 비교</a></p><h1>채찍 · 이전 공격 보존본</h1><p>이전에 마음에 든 공격을 프레임·이펙트 그대로 보존했습니다. 1타 가로 → 2타 내려치기.<br>현재 확정본과 별도로 확인할 수 있습니다.</p><nav><button data-mode="combo" class="active">2타 연속</button><button data-mode="first">1타</button><button data-mode="second">2타</button><button id="play">일시정지</button><button id="restart">처음부터</button><select id="speed"><option value="1">1배속</option><option value="0.5">0.5배속</option><option value="0.25">0.25배속</option></select><label><input id="fx" type="checkbox" checked>이펙트</label><label><input id="enemy" type="checkbox" checked>공격 대상</label></nav><canvas id="view" width="960" height="432"></canvas><nav><input id="scrub" type="range" min="0" max="69" value="0"><span id="status"></span></nav><details><summary>이전 공격 시안·효과 참고 자료</summary><ul><li><a href="추가시안/베기기반_채찍비교.html">초기 A·B·C 공격 후보</a></li><li><a href="추가시안/C_채찍이펙트비교.html">C 공격·거리별 효과 후보</a></li><li><a href="추가시안/기존픽셀_공격합성.html">기존 픽셀 효과 공격 합성</a></li><li><a href="추가시안/A_채찍_손방울.html">A 공격·손 방울</a></li><li><a href="추가시안/흑백_이펙트비교.html">흑백 효과 후보</a></li><li><a href="추가시안/C_프레임편집.html">이전 C 몸·팔 픽셀 편집</a></li><li><a href="추가시안/채찍_공격속박.html">초기 공격·속박 표현 예시</a></li></ul></details><p><a href="공격데이터.json" download>원래 프레임·타이밍 데이터</a> · <a href="../기존안내/이전공격/README.md">보존 내용</a></p><script src="data.js"></script><script>
const $=id=>document.getElementById(id);const frames=LEGACY_ATTACK.frames.map(load),effects=LEGACY_ATTACK.effects.map(load),enemy=load(LEGACY_ENEMY);function load(src){const i=new Image();i.src=src;return i;}const c=$('view').getContext('2d');c.imageSmoothingEnabled=false;const off=document.createElement('canvas');off.width=320;off.height=144;const g=off.getContext('2d');g.imageSmoothingEnabled=false;let time=0,last=null,run=true,mode='combo';const ranges={combo:[0,1400],first:[0,360],second:[360,1400]};function choose(k){mode=k;time=ranges[k][0];run=true;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===k));$('scrub').min=ranges[k][0]/20;$('scrub').max=ranges[k][1]/20-1;}function draw(){const i=Math.min(69,Math.max(0,Math.floor(time/20)));g.fillStyle='#455364';g.fillRect(0,0,320,144);g.fillStyle='#768698';g.fillRect(0,124,320,1);if($('enemy').checked)g.drawImage(enemy,128,5);g.drawImage(frames[i],0,0);if($('fx').checked)g.drawImage(effects[i],0,0);c.drawImage(off,0,0,960,432);$('scrub').value=i;$('status').textContent=(i+1)+' / 70 · '+Math.floor(time)+'ms';$('play').textContent=run?'일시정지':'재생';}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>choose(b.dataset.mode));$('play').onclick=()=>run=!run;$('restart').onclick=()=>choose(mode);$('scrub').oninput=e=>{time=Number(e.target.value)*20;run=false;draw();};for(const k of ['fx','enemy'])$(k).onchange=draw;function tick(t){const dt=last===null?0:Math.min(80,t-last)*Number($('speed').value);last=t;if(run){time+=dt;if(time>=ranges[mode][1])time=ranges[mode][0];}draw();requestAnimationFrame(tick);}Promise.all([...frames,...effects,enemy].map(i=>i.decode())).then(()=>requestAnimationFrame(tick));
</script></body></html>
