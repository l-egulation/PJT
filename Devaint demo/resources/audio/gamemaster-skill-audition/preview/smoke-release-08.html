<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>폭탄 B3 확정 · 연막 S16/S17</title><style>
body{background:#142123;color:#f2f0e8;font:16px/1.6 'Malgun Gothic',sans-serif;margin:0}main{max-width:950px;margin:auto;padding:28px 22px}h1,h3{margin:0}h2{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}article{background:#213335;border:1px solid #46605d;border-radius:10px;padding:16px}audio{width:100%;max-width:620px;margin:8px 0}button{background:#a3e1c9;border:0;border-radius:7px;padding:9px 14px;cursor:pointer;font:inherit}.chosen{background:#f1c281}.hint{color:#b5c4c2;font-size:13px}#selection{color:#f1c281}
</style></head><body><main><h1>폭탄 B3 · 연막 퍼짐 확정</h1><h2>폭탄 B3 · 확정 원음</h2><p>선택한 파일 그대로 보존했습니다. 게임 적용 전입니다.</p><audio controls preload="none" src="../source/focused-mixes-01/B3.wav"></audio><h2>연막 S16 → S17</h2><p>퍼짐만 1.1초 · 사이 1초 간격</p><audio controls preload="none" src="../source/smoke-release-08/S16-S17-compare.wav"></audio><div class="grid"><article><h3>S16 · 쉬이이이 · 기존 첫 번째 퍼짐</h3><p>앞의 팡 제거 · 퍼짐 1.1초</p><audio controls preload="none" src="../source/smoke-release-08/S16.wav"></audio><button data-id="S16">이 연막 선택</button></article><article><h3>S17 · 쉬이이이 · 기존 두 번째 퍼짐</h3><p>앞의 팡 제거 · 퍼짐 1.1초</p><audio controls preload="none" src="../source/smoke-release-08/S17.wav"></audio><button data-id="S17">이 연막 선택</button></article></div><p class="hint">연막은 팡을 제거한 이 버전으로 사용자 확정했습니다. 뒤의 퍼짐 음색·음량·길이는 그대로이며 게임 적용 전입니다.</p><p id="selection"></p><button id="save">선택 파일 저장</button></main><script>
const key='lost-words-smoke-release-08',players=[...document.querySelectorAll('audio')],buttons=[...document.querySelectorAll('[data-id]')];let selected=null;try{selected=JSON.parse(localStorage.getItem(key)||'null')}catch(_){}
for(const p of players){p.volume=.8;p.onplay=()=>{for(const q of players)if(p!==q)q.pause();};}
function update(){document.getElementById('selection').textContent=`폭탄 B3 확정 / 연막 ${selected||'퍼짐만 사용하는 최신 시안'} 확정`;for(const b of buttons){b.classList.toggle('chosen',b.dataset.id===selected);b.setAttribute('aria-pressed',String(b.dataset.id===selected));}}
for(const b of buttons)b.onclick=()=>{selected=b.dataset.id;localStorage.setItem(key,JSON.stringify(selected));update();};
document.getElementById('save').onclick=()=>{const data={kind:'focused-bomb-smoke-choice',version:8,bomb:{id:'B3',sha256:'822a47da3fe91fdce647b2196cb4103857468f142e35ae09c70bfdf7aa827af1',status:'user-confirmed'},smoke:{id:selected,revision:'smoke-release-08',status:'user-confirmed'},status:'not applied'};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='focused-bomb-smoke-choice-08.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};update();
</script></body></html>
