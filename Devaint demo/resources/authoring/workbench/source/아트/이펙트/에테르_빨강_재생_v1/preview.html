<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에테르 빨강 이펙트 재생</title><style>body{background:#171d25;color:#eee;font:16px/1.8 Malgun Gothic,sans-serif}main{max-width:1100px;margin:auto;padding:24px}section{display:flex;gap:24px;flex-wrap:wrap}article{background:#232b35;border-radius:12px;padding:20px;flex:1;min-width:260px}img{max-width:100%;image-rendering:pixelated}h2{font-size:19px}p{color:#bac3cc}a{color:#ffafa3}</style><main><h1>에테르 빨강 이펙트 · 원본 프레임 재생</h1><p>왼쪽 위부터 가로 순서로 재생. 구분선만 제외하고 원본 흰 배경과 형태를 유지했습니다. 프레임당 128px로 정리하고 3배 확대 표시합니다.</p><section><article><h2>표식 생성 · 4프레임</h2><img src="mark_preview.gif"><p>120 / 90 / 70ms → 마지막 모습 700ms 유지.</p></article><article><h2>폭발 · 9프레임</h2><img src="burst_preview.gif"><p>프레임당 70ms, 약 14fps. 마지막 빈 프레임은 380ms 유지.</p></article><article><h2>폭발 · 느리게 보기</h2><img src="burst_slow.gif"><p>프레임당 180ms, 약 5.6fps.</p></article></section><p>빨강의 역할: 표식 누적·폭발. 두 시트의 개별 재생 미리보기입니다.</p></main></html>
