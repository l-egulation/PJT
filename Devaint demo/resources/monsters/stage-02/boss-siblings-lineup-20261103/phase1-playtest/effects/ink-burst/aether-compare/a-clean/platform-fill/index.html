<!doctype html><html lang="ko"><meta charset="utf-8"><title>A안 · 발판 폭 맞춤</title><style>body{margin:20px;background:#18232d;color:#e9e8ed;font:16px system-ui}main{max-width:1000px;margin:auto}h1{font-size:24px}p{color:#c4cdd8;line-height:1.6}button,select,a{display:inline-block;padding:9px;margin:4px;color:#ebdfee;background:#33404f;border:1px solid #758798}canvas{display:block;max-width:100%;image-rendering:pixelated;margin-top:12px}input{width:260px;vertical-align:middle}</style><main><h1>A안 · 발판 전체 폭 배치</h1><p>위: 기존 크기 / 아래: 발판 전체 폭 96px에 맞춘 크기. 3색·세로 높이 유지 · 발판 접촉을 위해 전체 프레임을 2px 내렸습니다.<br>가로 2배 · 모든 프레임에 공통 배율 적용. 비교용 90ms/프레임이며 원본 재생 속도는 미제공.</p><button id="pause">일시정지</button><button id="reset">동시에 다시 재생</button><label>속도 <select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option><option value="1.5">1.5배</option></select></label><label><input type="checkbox" id="line" checked style="width:auto">바닥 기준선</label><p>프레임 <input id="scrub" type="range" min="0" max="15" step="1" value="0"><span id="count"></span></p><p><label>배경 <select id="bg"><option value="map">기존 맵</option><option value="white">흰색</option><option value="dark">짙은 회청색</option></select></label></p><canvas width="960" height="520"></canvas><p>디자인·합성 비교 미리보기 · 정리본 검토 · Unity 적용 전.</p></main><script type="module">
const load=p=>new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=()=>j(Error(p));i.src=p});
const [map,tile,...images]=await Promise.all(['../../../../../../map-preview/assets/D.png','../../../../../../map-preview/assets/terrain-preview.png',...['../frames','frames'].flatMap(label=>Array.from({length:16},(_,i)=>label+'/'+String(i).padStart(2,'0')+'.png'))].map(load));
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),$=s=>document.querySelector(s);let running=true,elapsed=0,last=performance.now(),key=0;
$('#pause').onclick=()=>{running=!running;$('#pause').textContent=running?'일시정지':'재생'};$('#reset').onclick=()=>{elapsed=0;key=0;running=true;last=performance.now();$('#pause').textContent='일시정지'};$('#scrub').oninput=e=>{key=Number(e.target.value);elapsed=key*.09;running=false;$('#pause').textContent='재생'};
function draw(now){let dt=Math.max(0,Math.min(.2,(now-last)/1000));last=now;if(running){elapsed+=dt*(Number($('#speed').value)||1);key=Math.max(0,Math.min(15,Math.floor((elapsed%1.9)/.09)))||0;$('#scrub').value=key}ctx.imageSmoothingEnabled=false;if($('#bg').value==='map')ctx.drawImage(map,0,0,960,520);else{ctx.fillStyle=$('#bg').value==='white'?'#ffffff':'#16202a';ctx.fillRect(0,0,960,520);}
for(let row=0;row<2;row++){let foot=row===0?238:494;for(const [center,s] of [[160,1],[610,3]]){ctx.drawImage(tile,128,192,96,16,center-48*s,foot,96*s,16*s);ctx.drawImage(images[row*16+key]||images[row*16],center-48*s,foot-70*s,96*s,80*s);if($('#line').checked){ctx.strokeStyle='#ccb87e';ctx.lineWidth=1;ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(center-48*s,foot+.5);ctx.lineTo(center+48*s,foot+.5);ctx.stroke();ctx.setLineDash([])}}ctx.fillStyle='rgba(12,19,29,.85)';ctx.fillRect(12,row===0?8:260,936,30);ctx.fillStyle='#e8deeb';ctx.font='16px system-ui';ctx.fillText((row===0?'A · 기존 크기':'A · 발판 전체 폭')+'                 실제 크기 1×                          확대 3×',24,row===0?29:281)}$('#count').textContent=String(key+1).padStart(2,'0')+' / 16';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
