<!doctype html><html lang="ko"><meta charset="utf-8"><title>레이피어 3타 시안</title><style>body{background:#19232c;color:#eee;max-width:1152px;margin:24px auto;font:16px system-ui}button,select{padding:12px;background:#34485c;color:white;border:1px solid #8495a6;margin:4px;border-radius:5px;cursor:pointer}canvas,img{image-rendering:pixelated;max-width:100%}canvas{background:#465161;width:100%}p{color:#becbd6}#frames button{padding:8px}</style><h2>레이피어 · 3타 프레임 시안</h2><p>1·2타: 첫 번째 결과의 짧은 찌르기 / 3타: 두 번째 결과의 발 들기 → 깊은 찌르기<br>화면 클릭 / Space: 한 타씩 공격. 공격 중 다음 입력 1회 예약, 종료 후 300ms 안에 클릭하면 다음 타.<br>두 결과에서 12프레임 추출 · 6색 정리 · 눈과 검 끝 보정 · 이펙트 없음</p><button id="attack">공격</button><button id="auto">3타 연속 보기</button><button id="reset">대기</button><select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option><option value="0.25">0.25배</option></select><span id="status"></span><canvas id="view" width="896" height="704" tabindex="0"></canvas><h3>타별 재생</h3><nav id="hits"></nav><h3>프레임 하나씩 보기</h3><nav id="frames"></nav><img src="프레임비교.png"><script>const data=[{"name": "1타 · 짧은 찌르기", "frames": ["../../03_작업중/레이피어_3타시안/1타/01.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/1타/02.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/1타/03.png?v=eyes-2x5-clean-v2"], "ms": [55, 80, 45], "source_frames": ["A5", "A6", "A9"]}, {"name": "2타 · 짧은 찌르기", "frames": ["../../03_작업중/레이피어_3타시안/2타/01.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/2타/02.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/2타/03.png?v=eyes-2x5-clean-v2"], "ms": [45, 75, 45], "source_frames": ["A10", "A12", "A16"]}, {"name": "3타 · 발 들고 깊게 찌르기", "frames": ["../../03_작업중/레이피어_3타시안/3타/01.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/3타/02.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/3타/03.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/3타/04.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/3타/05.png?v=eyes-2x5-clean-v2", "../../03_작업중/레이피어_3타시안/3타/06.png?v=eyes-2x5-clean-v2"], "ms": [55, 60, 130, 110, 70, 75], "source_frames": ["B11", "B13", "B15", "B18", "B24", "B28"]}];const $=id=>document.getElementById(id);const pics={};const paths=['../../03_작업중/레이피어_3타시안/대기.png',...data.flatMap(v=>v.frames)];const ready=Promise.all(paths.map(p=>{let i=new Image();i.src=p;pics[p]=i;return i.decode()}));let hit=0,state='idle',time=0,queued=false,auto=false,last=0,manual=null;function start(h){hit=h;state='attack';time=0;queued=false;manual=null}function press(){if(state==='attack'){if(hit<2)queued=true}else if(state==='wait')start(hit+1);else start(0)}function update(dt){if(manual)return;time+=dt;if(state==='attack'){let total=data[hit].ms.reduce((a,b)=>a+b,0);if(time>=total){if(hit<2&&(queued||auto))start(hit+1);else{state=hit<2?'wait':'recover';time=0}}}else if(state==='wait'&&time>=300){state='recover';time=0}else if(state==='recover'&&time>=100){state='idle';auto=false;time=0}}function path(){if(manual)return manual;if(state==='idle')return '../../03_작업중/레이피어_3타시안/대기.png';let d=data[hit];if(state!=='attack')return state==='wait'?d.frames.at(-1):'../../03_작업중/레이피어_3타시안/대기.png';let t=time;for(let i=0;i<d.ms.length;i++){if(t<d.ms[i])return d.frames[i];t-=d.ms[i]}return d.frames.at(-1)}const c=$('view').getContext('2d');c.imageSmoothingEnabled=false;function draw(){c.fillStyle='#465161';c.fillRect(0,0,896,704);c.fillStyle='#8998a8';c.fillRect(0,548,896,4);c.drawImage(pics[path()],0,0,896,704);$('status').textContent=manual?'프레임 확인':state==='idle'?'대기':data[hit].name+(state==='wait'?' · 다음 입력 대기':'')+(queued?' · 예약됨':'')}function tick(t){let dt=last?Math.min(60,t-last)*+$('speed').value:0;last=t;update(dt);draw();requestAnimationFrame(tick)}$('attack').onclick=press;$('view').onclick=press;$('auto').onclick=()=>{auto=true;start(0)};$('reset').onclick=()=>{state='idle';manual=null;auto=false;queued=false;time=0};window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['BUTTON','SELECT'].includes(e.target.tagName)){e.preventDefault();press()}});data.forEach((d,h)=>{let b=document.createElement('button');b.textContent=d.name;b.onclick=()=>{auto=false;start(h)};$('hits').append(b);d.frames.forEach((p,n)=>{let f=document.createElement('button');f.textContent=(h+1)+'타 '+(n+1)+'F';f.onclick=()=>{manual=p;auto=false;queued=false};$('frames').append(f)})});ready.then(()=>requestAnimationFrame(tick)).catch(e=>$('status').textContent=e.message);</script></html>
