<!doctype html><html lang="ko"><meta charset="utf-8"><title>잉크 함정 · 속박 레이어 검토</title><style>body{margin:24px;background:#18232d;color:#e6e7ec;font:16px system-ui}main{max-width:1000px;margin:auto}p{color:#bac9d3;line-height:1.7}canvas{max-width:100%;image-rendering:pixelated;display:block;margin:16px 0}button,a{color:#e8d7ef;background:#33404f;border:1px solid #788797;padding:10px;display:inline-block;margin-right:12px}h1{font-size:24px}</style><main><h1>잉크 함정 · 속박 레이어</h1><p>승인 플레이어 원본 + 발목·종아리를 감싸는 별도 투명 잉크 레이어 · 기존보다 가로 27%, 높이 36% 확대.<br>함정은 거품이 부풀고 터지는 8프레임. 속박 잉크가 바닥에서 솟아올라 발목을 감싼 뒤 2초 유지합니다.</p><button id="root">속박 다시 보기</button><button id="hold">속박 고정 보기</button><a href="../../">1페이즈 조작 테스트</a><canvas width="960" height="360"></canvas><p id="status"></p><p>디자인 시안 및 합성 미리보기 · Unity 적용 전</p></main><script type="module">
import {drawRoot} from './emerge.mjs?v=4';
const c=document.querySelector('canvas'),x=c.getContext('2d');
const load=p=>new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=()=>j(Error(p));i.src=p});
const [map,player,root,terrain,...traps]=await Promise.all(['../../../map-preview/assets/D.png','../../../map-preview/assets/approved-player.png','root.png','../../../map-preview/assets/terrain-preview.png',...Array.from({length:8},(_,i)=>'trap-'+String(i).padStart(2,'0')+'.png')].map(load));
const pc=document.createElement('canvas');pc.width=player.width;pc.height=player.height;let px=pc.getContext('2d');px.drawImage(player,0,0);let data=px.getImageData(0,0,pc.width,pc.height).data,l=pc.width,t=pc.height,r=0,b=0;for(let yy=0;yy<pc.height;yy++)for(let xx=0;xx<pc.width;xx++)if(data[(yy*pc.width+xx)*4+3]>128){l=Math.min(l,xx);t=Math.min(t,yy);r=Math.max(r,xx);b=Math.max(b,yy)}
let start=performance.now(),hold=false;document.querySelector('#root').onclick=()=>{hold=false;start=performance.now()};document.querySelector('#hold').onclick=()=>{hold=!hold};
function draw(now){let age=(now-start)/1000,active=hold||age%4<2,frame=Math.floor(now/120)%8;x.imageSmoothingEnabled=false;x.drawImage(map,0,130,960,360,0,0,960,360);x.fillStyle='rgba(12,19,29,.82)';x.fillRect(12,12,936,42);x.font='18px system-ui';x.fillStyle='#e6d9ee';x.fillText('実寸 1×                         ピクセル拡大 4×'.replace('実寸','실제 크기').replace('ピクセル拡大','픽셀 확대'),32,40);
for(const [cx,foot,s] of [[150,255,1],[565,306,4]]){x.drawImage(terrain,128,192,96,16,cx-48*s,foot,96*s,16*s);x.drawImage(traps[frame],cx-48*s,foot-20*s,96*s,24*s);x.drawImage(player,l,t,r-l+1,b-t+1,cx-33*s,foot-64*s,66*s,64*s);if(active)drawRoot(x,root,cx,foot,s,hold?1:age%4,hold?1:2-age%4)}
document.querySelector('#status').textContent=active?'속박 중 · 이동·점프·대시 제한 / 공격 가능':'해제 · 캐릭터 원본 그대로';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
