apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-blue
  namespace: hanjjak
spec:
  replicas: 0
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/slot: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/slot: blue
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: web-assets
          image: docker.io/hanjjak/web:bootstrap
          command: ["sh", "-c"]
          args:
            - >-
              set -eu; src=/usr/share/nginx/html/assets; tmp="$(mktemp -d /asset-store/.incoming.XXXXXX)";
              cp -a "$src/." "$tmp/";
              find "$tmp" -type f -exec sh -eu -c 'tmp="$1"; shift; for file do rel="${file#"$tmp/"}"; mkdir -p "/asset-store/$(dirname "$rel")"; mv -f "$file" "/asset-store/$rel"; done' sh "$tmp" {} +;
              rm -rf "$tmp"
          volumeMounts:
            - name: web-assets
              mountPath: /asset-store
      containers:
        - name: web
          image: docker.io/hanjjak/web:bootstrap
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BASIC_AUTH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: BASIC_AUTH_ENABLED
            - name: BASIC_AUTH_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: application-config
                  key: BASIC_AUTH_USERNAME
            - name: BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secrets
                  key: BASIC_AUTH_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: web-assets
              mountPath: /usr/share/nginx/html/assets
              readOnly: true
      volumes:
        - name: web-assets
          persistentVolumeClaim:
            claimName: web-assets
---
