<!doctype html><html lang="ko"><meta charset="utf-8"><title>보스 모션 비율 비교</title><style>*{box-sizing:border-box}body{margin:0;background:#222731;color:#eee;font:16px system-ui}header{padding:22px;position:sticky;top:0;background:#222731f2;z-index:2;border-bottom:1px solid #526075}h1{font-size:22px;margin:0 0 10px}button,select{font:inherit;background:#3a4352;color:white;border:1px solid #748298;padding:8px 12px;border-radius:5px;margin-right:8px}p{color:#c7ccd5;font-size:14px;margin:10px 0}section{padding:20px;overflow-x:auto}h2{font-size:19px} .row{display:flex;gap:10px;min-width:max-content}.card{width:320px;background:#303846;border:1px solid #596577;padding:10px}.card h3{font-size:16px;margin:0 0 5px}.card small{display:block;color:#c8ced8;min-height:20px}canvas{display:block;image-rendering:pixelated}.label{height:25px;font:13px monospace;color:#fff}a{color:#edb1d5}</style><header><h1>기본 자세 · 전체 모션 비율 비교</h1><button id="play">일시정지</button><button id="reset">처음부터</button><button id="prev">이전 프레임</button><button id="next">다음 프레임</button><select id="zoom"><option value="1" selected>1배</option><option value="2">2배</option><option value="3">3배</option></select><select id="bg"><option value="#737d8b">회색</option><option value="#ffffff">흰색</option><option value="#202631">어두운 배경</option></select><p>모든 이미지에 같은 배율 적용 · 원본 배율 유지 · 좌우 빈 여백만 접어서 표시 · 점선은 공통 발바닥 기준(y=232). 공중 자세는 원래 높이를 유지합니다. 가로로 스크롤해서 비교하세요.</p><a href="index.html">컷씬으로 돌아가기</a></header><div id="groups"></div><script>
const img={},names=[...Array.from({length:8},(_,i)=>'rose-'+i+'-approved94'),'rose-7-90','rose-7-94','player','rose-idle','blue-idle','blue-roar-01','fused-blue-idle','fused-blue-arrival-04',...Array.from({length:8},(_,i)=>'rose-'+i),...Array.from({length:8},(_,i)=>'landing-'+i),...Array.from({length:16},(_,i)=>'recover-'+(i+21))];let t=0,run=true,last=0,zoom=1,bg='#737d8b',ready=false;
const entries=[
 ['로즈 쓰러짐 크기 보정 비교',[['rose-idle','로즈 기본','승인 기본 자세'],['rose-7','쓰러짐 원본 100%','현재 컷씬 크기'],['rose-7-94','쓰러짐 94%','6% 축소 · 발밑 고정'],['rose-7-90','쓰러짐 90%','10% 축소 · 발밑 고정'],['blue-idle','블루 기본','옆에서 체격 비교']]],
 ['비교 기준',[['player','플레이어 기본','승인 캐릭터'],['rose-idle','로즈 기본','몸 높이 120px'],['rose-motion','로즈 쓰러짐 B · 94%','8프레임 · 동작 440ms'],['rose-7-approved94','로즈 최종 쓰러짐 · 94%','대사·흡수 시작 자세']]],
 ['블루 · 기본 → 낙하 → 착지 → 회복',[['blue-idle','블루 기본','몸 높이 139px'],['landing-1','블루 낙하 자세','공중 이동 제외 · 자세 비율 확인'],['land-motion','블루 착지','착지 원본 16~20'],['recover-motion','블루 일어서기','원본 21~36 · 80ms'],['recover-36','블루 회복 마지막','기본 자세와 직접 비교']]],
 ['블루 · 포효 → 강화형',[['blue-idle','블루 기본','강화 전 기준'],['blue-roar-01','블루 포효','승인 공중 자세 · lift 9px'],['fused-blue-arrival-04','강화형 등장','승인 등장 완료 자세'],['fused-blue-idle','강화형 기본','몸 높이 179px · 석궁 포함 215px']]]];
const cards=[];for(const [title,list]of entries){let sec=document.createElement('section');sec.innerHTML='<h2>'+title+'</h2><div class="row"></div>';document.querySelector('#groups').append(sec);for(const [key,title,note]of list){let el=document.createElement('div');el.className='card';el.innerHTML='<h3>'+title+'</h3><small>'+note+'</small><canvas width="200" height="256"></canvas><div class="label"></div>';sec.querySelector('.row').append(el);cards.push({key,el,c:el.querySelector('canvas'),label:el.querySelector('.label')})}}
function choose(seq,tt){let sum=0;for(let i=0;i<seq.length;i++){sum+=seq[i];if(tt<sum)return i}return seq.length-1}
function render(){for(const v of cards){let key=v.key,info='기본 / 고정 자세';if(key==='rose-motion'){let q=t%1.69,idx=choose([.35,.09,.06,.04,.04,.12,.09,.9],q);key='rose-'+idx+'-approved94';info='프레임 '+(idx+1)+' / 8'}if(key==='land-motion'){let q=t%1.32,idx=choose([.05,.05,.06,.07,.09,1],q);idx=Math.min(4,idx);key='landing-'+(idx+3);info='착지 '+(idx+1)+' / 5'}if(key==='recover-motion'){let idx=Math.min(15,Math.floor((t%2.08)/.08));key='recover-'+(21+idx);info='원본 '+(21+idx)+' / 36'}let g=v.c.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle=bg;g.fillRect(0,0,200,256);g.strokeStyle=bg==='#ffffff'?'#858585':'#bac1c9';g.setLineDash([4,4]);g.beginPath();g.moveTo(0,232.5);g.lineTo(200,232.5);g.stroke();g.setLineDash([]);g.strokeStyle='#a0aab355';g.beginPath();g.moveTo(100.5,0);g.lineTo(100.5,256);g.stroke();g.drawImage(img[key],-92,0);v.label.textContent=info;v.c.style.width=200*zoom+'px';v.c.style.height=256*zoom+'px';v.el.style.width=200*zoom+22+'px'}}
function tick(now){if(!last)last=now;if(run)t+=Math.min(.05,(now-last)/1000);last=now;if(ready)render();requestAnimationFrame(tick)}
document.querySelector('#play').onclick=()=>{run=!run;document.querySelector('#play').textContent=run?'일시정지':'재생'};document.querySelector('#reset').onclick=()=>t=0;document.querySelector('#prev').onclick=()=>{run=false;t=Math.max(0,t-.04);document.querySelector('#play').textContent='재생'};document.querySelector('#next').onclick=()=>{run=false;t+=.04;document.querySelector('#play').textContent='재생'};document.querySelector('#zoom').onchange=e=>zoom=+e.target.value;document.querySelector('#bg').onchange=e=>bg=e.target.value;
Promise.all(names.map(n=>new Promise((res,rej)=>{let a=new Image;a.onload=()=>{img[n]=a;res()};a.onerror=rej;a.src='assets/'+n+'.png'}))).then(()=>ready=true);requestAnimationFrame(tick);
</script></html>
