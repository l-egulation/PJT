<!doctype html><html lang="ko"><meta charset="utf-8"><title>Rose 화살비 · 1페이즈 패턴3</title><style>body{margin:20px;background:#18232d;color:#e8e7ed;font:16px system-ui}main{max-width:1000px;margin:auto}h1{font-size:24px}p{color:#c0cfda;line-height:1.6}button,a{display:inline-block;padding:10px;margin:4px;color:#ead6e4;background:#33404f;border:1px solid #74879b}canvas{display:block;max-width:100%;image-rendering:pixelated;margin:12px 0}#status{min-height:26px}</style><main><h1>Rose 화살비 · 패턴 3</h1><p>중앙 잉크 폭발 → 나머지 6개 발판 전조 1초 → 화살비 1초.<br>발판 표면에서 차오르는 전조: 잉크 보라 / 화살비 분홍. 승인된 마법 화살 재사용. 화살은 116~144px 높이에서 위치·낙하 시점을 달리해 쏟아집니다. 잉크 폭발 높이 1.65배. 피해 판정은 기존 설정 유지.</p><button id="reset">처음부터 보기</button><button id="warnInk">잉크 전조 보기</button><button id="warnRose">화살비 전조 보기</button><button id="burst">잉크 폭발 순간 보기</button><button id="rain">화살비 순간 보기</button><button id="pause">일시정지</button><a href="../../">1페이즈 조작 테스트</a><p id="status"></p><canvas id="map" width="960" height="540"></canvas><p>발판 한 곳 · 4배 확대</p><canvas id="zoom" width="480" height="640"></canvas><p>디자인 및 합성 미리보기 · Unity 적용 전. 화살비 피해는 시작 시 7 + 0.5초에 7.</p></main><script type="module">
import {drawPlatformGlow} from '../platform-glow.mjs';
import {drawRain} from './rain.mjs?v=2';import {drawBurst} from '../ink-burst/aether-compare/a-clean/platform-fill/selected-burst.mjs?v=2';import {platforms} from '../../rules.mjs';
const load=p=>new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=()=>j(Error(p));i.src=p});
const [map,terrain,source,...burst]=await Promise.all(['../../../map-preview/assets/D.png','../../../map-preview/assets/terrain-preview.png','../../../rose-static-shot/rose-enchanted-bolt-original.png',...Array.from({length:16},(_,i)=>'../ink-burst/aether-compare/a-clean/platform-fill/frames/'+String(i).padStart(2,'0')+'.png')].map(load));
const tmp=document.createElement('canvas');tmp.width=source.width;tmp.height=source.height;const tc=tmp.getContext('2d');tc.drawImage(source,0,0);let data=tc.getImageData(0,0,tmp.width,tmp.height).data,l=tmp.width,t=tmp.height,r=0,b=0;for(let yy=0;yy<tmp.height;yy++)for(let xx=0;xx<tmp.width;xx++)if(data[(yy*tmp.width+xx)*4+3]>24){l=Math.min(l,xx);r=Math.max(r,xx);t=Math.min(t,yy);b=Math.max(b,yy)}const bolt=document.createElement('canvas');bolt.width=r-l+1;bolt.height=b-t+1;bolt.getContext('2d').drawImage(source,l,t,bolt.width,bolt.height,0,0,bolt.width,bolt.height);
const ctx=document.querySelector('#map').getContext('2d'),z=document.querySelector('#zoom').getContext('2d');let last=performance.now(),elapsed=0,running=true;document.querySelector('#reset').onclick=()=>{elapsed=0;last=performance.now();running=true;document.querySelector('#pause').textContent='일시정지'};document.querySelector('#pause').onclick=e=>{running=!running;e.target.textContent=running?'일시정지':'재생'};
document.querySelector('#burst').onclick=()=>{elapsed=1.09;running=false;document.querySelector('#pause').textContent='재생'};
document.querySelector('#rain').onclick=()=>{elapsed=2.08;running=false;document.querySelector('#pause').textContent='재생'};
document.querySelector('#warnInk').onclick=()=>{elapsed=.8;running=false;document.querySelector('#pause').textContent='재생'};document.querySelector('#warnRose').onclick=()=>{elapsed=1.8;running=false;document.querySelector('#pause').textContent='재생'};
function draw(now){const dt=Math.max(0,Math.min(.2,(now-last)/1000));last=now;if(running)elapsed+=dt;const age=elapsed%4.2;ctx.imageSmoothingEnabled=false;ctx.drawImage(map,0,0);for(const p of platforms)ctx.drawImage(terrain,128,192,96,16,p.x,p.y,p.w,16);if(age<1)drawPlatformGlow(ctx,platforms[3],age,'ink');drawBurst(ctx,burst,432,286,age);for(let i=0;i<7;i++)if(i!==3)drawRain(ctx,bolt,platforms[i],age-1);
z.imageSmoothingEnabled=false;z.drawImage(map,120,150,120,160,0,0,480,640);z.drawImage(terrain,128,192,96,16,48,576,384,64);if(age<1)drawPlatformGlow(z,{x:48,y:576,w:384},age,'ink',4);else drawRain(z,bolt,{x:48,y:576,w:384},age-1,4);
document.querySelector('#status').textContent=(age<1?'중앙 폭발 전조':age<2?'중앙 폭발 · 나머지 6개 발판 전조':age<3?'화살비 · 중앙 발판 안전':'종료 · 다음 반복 대기')+' · '+age.toFixed(2)+'초';requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
