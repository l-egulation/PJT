services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: hanjjak
      POSTGRES_USER: hanjjak
      POSTGRES_PASSWORD: local-only
    ports:
      - "${LOCAL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanjjak"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - hanjjak-postgres:/var/lib/postgresql/data
volumes:
  hanjjak-postgres:

# Market fixture data is loaded explicitly through the fixture runner; the database
# volume remains policy-neutral and production-like by default.
