<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>빨강 v4 미리보기</title><style>body{background:#151d26;color:#f3e8dc;font:16px/1.8 Malgun Gothic,sans-serif;margin:0}main{max-width:1080px;margin:auto;padding:28px 20px}section{background:#222c36;padding:24px;border-radius:14px;margin:24px 0}img{max-width:100%;display:block;margin:auto;image-rendering:pixelated}p{color:#bbc5cf}a{color:#ffb0a2}</style><main><h1>빨강 v4 · 머리 위 가로 표식</h1><p>게임 아트로 만든 합성 미리보기입니다. Unity 적용 변경은 회수했습니다.</p><section><img src="check_109.png"><p>표식은 몬스터 머리 위에 가로로 쌓입니다. 세 번째 표식이 보인 뒤 세 표식이 몸통 중심으로 모이고, 밝은 중심과 굵은 붉은 잉크가 크게 터집니다.</p><p><b>역할:</b> 빨강 — 표식 누적·폭발.</p></section><section><h2>폭발 단독</h2><img src="burst_board.png"><p>표식 10×14px · 간격 16px · 폭발 최대 약108px. 한 셀은128×128px.</p></section><section><h2>폭발 프레임</h2><img src="burst_board.png"><a href="burst_128px_3x3.png">투명 시트</a></section></main></html>
