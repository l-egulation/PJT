apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: hanjjak
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.8.3
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token-file", "/var/run/hanjjak-secrets/token"]
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tunnel-token
              mountPath: /var/run/hanjjak-secrets
              readOnly: true
      volumes:
        - name: tunnel-token
          secret:
            secretName: cloudflare-token
            items:
              - key: token
                path: token
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: hanjjak
spec:
  schedule: "17 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:17.11-alpine
              command: ["sh", "-c"]
              args:
                - >-
                  set -eu;
                  export PGPASSWORD="$(cat /var/run/hanjjak-secrets/db-password)";
                  target="/backups/hanjjak-$(date -u +%Y%m%dT%H%M%SZ).dump";
                  pg_dump --host=postgres --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --format=custom --no-owner --no-privileges --file="$target";
                  test -s "$target";
                  find /backups -type f -name 'hanjjak-*.dump' -mtime +"$BACKUP_RETENTION_DAYS" -delete
              envFrom:
                - configMapRef:
                    name: application-config
              env:
                - name: BACKUP_RETENTION_DAYS
                  value: "14"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: db-password
                  mountPath: /var/run/hanjjak-secrets
                  readOnly: true
          volumes:
            - name: backups
              hostPath:
                path: /var/backups/hanjjak
                type: Directory
            - name: db-password
              secret:
                secretName: db-password
                items:
                  - key: password
                    path: db-password
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: hanjjak
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
