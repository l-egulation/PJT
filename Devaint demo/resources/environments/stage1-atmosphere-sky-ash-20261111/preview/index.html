<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>채택한 1스테이지 미술</title><style>*{box-sizing:border-box}body{font:16px/1.6 system-ui;background:#f4f1e9;color:#423d37;margin:24px}main{max-width:1100px;margin:auto}h1{font-size:25px}select,button{font:inherit;padding:7px 12px;border:1px solid #c8c0b3;border-radius:5px;background:#fffaf4;color:inherit}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0}.scroll{overflow:auto;border:1px solid #d3cbbf}img.game,video{display:block;width:960px;height:540px;max-width:none;image-rendering:pixelated}.note{font-size:14px;color:#72695e}a{color:#665744}.assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}.asset{padding:10px;border:1px solid #d3cbbf}.asset img{image-rendering:pixelated;max-width:100%;display:block;margin:12px auto}details{margin-top:24px}</style><main><h1>채택한 1스테이지 · 잔디 마을과 종잇재</h1><p>32px 재사용 지형·나무 발판 / 분리된 산·마을 / 구름 6종·새 무리 6종 / 회갈색·검정·흰색 종잇재.</p><div class="controls"><label>공간 <select id="room"><option value="s1-08">넓은 방</option><option value="s1-04">계단</option><option value="s1-07">수직 방 아래</option><option value="s1-07-upper">수직 방 위</option></select></label><button id="zoom">정수 2배 확대</button><span class="note">960×540 · 1u=32px · 실제 캐릭터와 Unity 카메라</span></div><div class="scroll"><img id="game" class="game" src="s1-08-approved.png" alt="채택한 미술을 적용한 게임 화면"></div><p>종잇재 · 회갈색 67개 / 검정 10개 / 흰색 19개</p><div class="scroll"><video controls muted loop playsinline poster="s1-08-approved.png"><source src="paper-ash-mixed-960.mp4" type="video/mp4"></video></div><p class="note">효과를 8fps로 캡처한 6초 미리보기다. 게임 프레임 속도를 의미하지 않는다. <a href="paper-ash-mixed-960.gif">GIF</a> · <a href="../README.md">적용 안내</a> · <a href="../runtime/sky-weather.json">배치 규격</a> · <a href="../../stage1-pixel-lawn-wood-32/README.md">타일 규격</a> · <a href="../../stage1-pixel-background-native-20261111/README.md">배경 규격</a></p><details><summary>분리 PNG와 코드</summary><p><a href="../source/Stage1Atmosphere.cs">종잇재·랜덤 하늘 코드</a> · <a href="../source/Stage1ApprovedReview.cs">채택본 Unity 검토 어댑터</a> · <a href="../source/requests.json">구름·새 생성 요청문</a></p><div class="assets" id="assets"></div></details></main><script>const room=document.getElementById('room'),game=document.getElementById('game');room.onchange=()=>game.src=room.value+'-approved.png';let big=false;document.getElementById('zoom').onclick=()=>{big=!big;game.style.width=(big?1920:960)+'px';game.style.height=(big?1080:540)+'px';document.getElementById('zoom').textContent=big?'원본 1배':'정수 2배 확대'};for(const kind of ['clouds','birds'])for(let i=0;i<6;i++){const a=document.createElement('article');a.className='asset';a.innerHTML=`${kind==='clouds'?'구름':'새 무리'} ${i+1}<a href="../runtime/${kind}/${kind}-${i}.png"><img src="../runtime/${kind}/${kind}-${i}.png" alt="${kind} ${i+1}"></a>`;document.getElementById('assets').append(a)}</script></html>
